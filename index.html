<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>D&amp;D Ledger</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><link rel="icon" href="assets/icons/icon-192.png"><meta name="theme-color" content="#2E6A4E"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>D&amp;D Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky vitals bar over a tabbed play surface; two columns on desktop, one on phones with bottom tabs. */
:root{
  --bg:#E9ECE6; --panel:#F7F8F4; --sunk:#E0E4DC; --ink:#1D2320; --muted:#5B645D; --line:#C9CFC5;
  --accent:#2E6A4E; --accent-ink:#FFFFFF; --gold:#9A6B12; --danger:#AE3528; --info:#2C5C8A; --psy:#6A4C9E; --ok:#2E7D4F;
  --f-display:"Alegreya SC", "Palatino Linotype", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131614; --panel:#1B1F1C; --sunk:#232825; --ink:#E7E2D4; --muted:#9BA196; --line:#313833;
  --accent:#71B28E; --accent-ink:#0E1511; --gold:#E0B04C; --danger:#E5735F; --info:#86AEDA; --psy:#AE91E0; --ok:#7CC496; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131614; --panel:#1B1F1C; --sunk:#232825; --ink:#E7E2D4; --muted:#9BA196; --line:#313833;
  --accent:#71B28E; --accent-ink:#0E1511; --gold:#E0B04C; --danger:#E5735F; --info:#86AEDA; --psy:#AE91E0; --ok:#7CC496; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.15rem}
h3{font-size:1rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.ident{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.ident h1{font-size:1.35rem;line-height:1.1}
.ident .sub{font-size:.82rem;color:var(--muted)}
.vitals{display:flex;gap:6px;flex-wrap:wrap}
.vital{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:54px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.vital b{font-family:var(--f-num);font-size:1.05rem;font-variant-numeric:tabular-nums}
.vital span{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.vital.hp{min-width:110px;position:relative;overflow:hidden}
.hpbar{position:absolute;left:0;bottom:0;height:3px;background:var(--ok)}
.hpbar.low{background:var(--danger)}
@media (max-width:600px){.top{position:static}.vital{min-width:48px;padding:3px 6px}.vital.hp{min-width:90px}}
.toprow2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:.82rem}
.pill.live{border-color:var(--accent);color:var(--accent);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.sess-btn{font-size:.85rem;padding:6px 14px}
.sess-btn.live{background:var(--danger);border-color:var(--danger);color:#fff}
.sess-btn.live .dot{background:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.sess-meta{font-size:.8rem;color:var(--muted)}
.xp{display:flex;flex-direction:column;gap:3px;min-width:170px;flex:1 1 170px;max-width:300px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:left;font:inherit;color:inherit;cursor:pointer}
.xp:hover{border-color:var(--muted)}
.xp .xl{display:flex;justify-content:space-between;gap:8px;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.xp .xl b{font-family:var(--f-num);font-size:.8rem;letter-spacing:0;text-transform:none;color:var(--ink,inherit)}
.xp .xbar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.xp .xbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.xp.ready{border-color:var(--gold)}
.xp .xn{font-size:.72rem;color:var(--muted)}
.ev .acts{display:flex;gap:4px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.ev-edit{border:1px solid transparent;background:none;color:var(--muted);font-size:.72rem;font-weight:700;padding:1px 6px;border-radius:6px;cursor:pointer}
.ev-edit:hover,.ev-edit:focus-visible{border-color:var(--line);color:var(--accent)}
.tag.ed{font-style:italic}
.tag.ok-tag{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 12px;border-bottom:3px solid transparent;font-weight:700;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main .wrap{padding-block:16px 96px}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-h h2{margin-right:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:8px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:4px 8px}
.btn.small{padding:4px 9px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .k{font-weight:400;color:var(--muted);font-size:.78rem}
.btn.primary .k{color:inherit;opacity:.8}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.qa{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.qa:hover{border-color:var(--accent)}
.qa b{font-size:.92rem}
.qa span{font-size:.76rem;color:var(--muted)}
.qa.psy{border-left:3px solid var(--psy)}
.qa.gold{border-left:3px solid var(--gold)}
.qa.info{border-left:3px solid var(--info)}
.qa:disabled{opacity:.45}

/* economy chips */
.econ{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:700;background:var(--bg)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.spent{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.chip.psy.on{background:var(--psy);border-color:var(--psy)}

/* resource pips */
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.res:first-of-type{border-top:0}
.res .nm{font-weight:700;font-size:.9rem;min-width:0}
.res .meta{font-size:.74rem;color:var(--muted);grid-column:1/-1;margin-top:-2px}
.pips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.pip{width:20px;height:20px;border-radius:50%;border:2px solid var(--accent);background:var(--accent);padding:0}
.pip.used{background:transparent;border-color:var(--line)}
.pip.gold{border-color:var(--gold);background:var(--gold)}
.pip.gold.used{background:transparent;border-color:var(--line)}
.pip.psy{border-color:var(--psy);background:var(--psy)}
.pip.psy.used{background:transparent;border-color:var(--line)}
.tag{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.short{color:var(--info)}
.tag.long{color:var(--gold)}
.tag.conc{color:var(--psy)}
.tag.ba{color:var(--accent)}

/* hp */
.hpctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hpctl input{width:84px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--f-num);font-size:1.05rem}
.bighp{font-family:var(--f-num);font-size:2rem;font-weight:600;line-height:1}
.bighp small{font-size:1rem;color:var(--muted)}

/* log list */
.log{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.ev:first-child{border-top:0}
.ev .tm{font-family:var(--f-num);font-size:.75rem;color:var(--muted);padding-top:2px}
.ev .tt{font-weight:700;font-size:.92rem;min-width:0;overflow-wrap:anywhere}
.ev .dd{font-size:.82rem;color:var(--muted);grid-column:2/-1;overflow-wrap:anywhere;white-space:pre-wrap}
.ev.undone .tt,.ev.undone .dd{text-decoration:line-through;opacity:.6}
.kind{font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid currentColor;white-space:nowrap}
.k-attack{color:var(--danger)} .k-spell{color:var(--psy)} .k-feature{color:var(--gold)} .k-hp{color:var(--ok)}
.k-rest{color:var(--info)} .k-combat{color:var(--ink)} .k-note{color:var(--muted)} .k-level{color:var(--gold)} .k-item{color:var(--info)} .k-session{color:var(--accent)}
.sess-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:12px 0 6px;border-bottom:2px solid var(--ink);margin-top:8px}
.sess-h h3{font-size:1.05rem}

/* spells */
.slotrow{display:flex;gap:14px;flex-wrap:wrap}
.slotgrp{display:flex;flex-direction:column;gap:4px}
.spell{border-top:1px solid var(--line);padding:9px 0;display:flex;flex-direction:column;gap:6px}
.spell:first-child{border-top:0}
.spell-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spell-h .nm{font-weight:700;margin-right:auto;min-width:0}
.spell .facts{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.spell .facts b{color:var(--ink);font-weight:700}
.spell p{margin:0;font-size:.88rem;max-width:68ch}
.spell details summary{cursor:pointer;font-size:.8rem;color:var(--accent);font-weight:700;list-style:none}
.spell details summary::-webkit-details-marker{display:none}
.lvl-h{font-family:var(--f-display);font-size:1rem;margin-top:8px;padding-bottom:4px;border-bottom:2px solid var(--ink);display:flex;gap:10px;align-items:baseline}

/* sheet */
.abil{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:520px){.abil{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ab{border:1px solid var(--line);border-radius:9px;padding:8px 4px;text-align:center;background:var(--bg)}
.ab .m{font-family:var(--f-num);font-size:1.35rem;font-weight:600}
.ab .s{font-size:.78rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:.88rem}
.kv .v{font-family:var(--f-num);text-align:right}
.kv .p{color:var(--accent);font-weight:700}
.feat{border-top:1px solid var(--line);padding:8px 0}
.feat:first-child{border-top:0}
.feat b{font-size:.92rem}
.feat p{margin:3px 0 0;font-size:.86rem;max-width:70ch}
table.inv{width:100%;border-collapse:collapse;font-size:.88rem}
table.inv td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:middle}
table.inv td.q{white-space:nowrap;text-align:right}
.tbl{overflow-x:auto}

/* forms */
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field input,.field select,.field textarea{padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
.field textarea{min-height:90px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 11px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.note-card{border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.warn{border-left:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--panel));padding:8px 10px;border-radius:6px;font-size:.86rem}
.bad{border-left-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--panel))}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* modal */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
@media (min-width:700px){.scrim{align-items:center}}
.modal{background:var(--panel);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.modal{border-radius:14px}}
.modal-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:.88rem;max-width:min(92vw,520px);box-shadow:0 6px 20px rgb(0 0 0 / .25)}
.toast.bad{background:var(--danger);color:#fff}

/* coins */
.coins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.coins .ab b{font-family:var(--f-num);font-size:1.15rem}
.cl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--line);font-size:.86rem;align-items:baseline}
.cl:first-child{border-top:0}
.cl .amt{font-family:var(--f-num);font-weight:700;white-space:nowrap}
.cl .amt.in{color:var(--ok)} .cl .amt.out{color:var(--danger)}
.cl .when{font-size:.74rem;color:var(--muted);white-space:nowrap}
.cl .now{grid-column:2/-1;font-size:.76rem;color:var(--muted)}

/* session journal panel */
.jr{position:fixed;z-index:15;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding:12px;box-shadow:0 8px 28px rgb(0 0 0 / .22);right:0;left:0;bottom:0;height:min(45vh,420px);border-radius:14px 14px 0 0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
body.jr-open main .wrap{padding-bottom:calc(min(45vh,420px) + 24px)}
.jr textarea{flex:1;min-height:0;resize:none;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:inherit;line-height:1.5}
.jr .card-h h2{font-size:1.05rem}
@media (min-width:1000px){.jr{left:auto;top:calc(env(safe-area-inset-top,0px) + 12px);bottom:12px;right:12px;width:360px;height:auto;border-radius:var(--r)}body.jr-open main .wrap,body.jr-open .top .wrap{padding-right:396px}body.jr-open main .wrap{padding-bottom:96px}}
.jr-fab{position:fixed;z-index:15;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:999px;box-shadow:0 6px 20px rgb(0 0 0 / .22);padding:10px 16px}
.cover{position:relative;height:clamp(160px,40vw,480px);background:#1d1b2e var(--cover-img,none) center 40%/cover no-repeat}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgb(0 0 0 / .45))}
.cover span{position:absolute;left:16px;bottom:10px;z-index:1;color:#fff;font-size:.8rem;opacity:.85;text-shadow:0 1px 3px #000}
.banner{font-size:.82rem;padding:6px 10px;border-radius:7px;background:var(--sunk);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.pip,.chip,.qa{transition:background .12s,border-color .12s}}
</style>

<div class="cover" id="cover" role="img" aria-label="Character art" hidden><span id="cover-name"></span></div>
<header class="top">
  <div class="wrap" id="topbar">
    <div class="ident"><h1>D&amp;D Ledger</h1><span class="sub">Opening the ledger…</span></div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" role="tablist"></nav></div>
</header>
<main><div class="wrap" id="view"><div class="empty">Loading your sheet and play history…</div></div></main>
<div id="jr-root"></div>
<div id="modal-root"></div>

<script>
"use strict";
/* ================= CORE RULES (2014 5e) =================
   Only rules every character shares live here. Classes, subclasses, races, feats, items and spells come
   from content packs (data/base-pack.json, the SRD files, packs/ and uploaded packs). See docs/data-formats.md.
   Data shapes borrow from open-source tools: resources as {max, used, recovery} (Foundry VTT dnd5e),
   spell fields level/school/casting_time/range/components/duration/concentration (5e-bits 5e-database, Open5e). */
const SKILLS=[["acrobatics","Acrobatics","dex"],["animalHandling","Animal Handling","wis"],["arcana","Arcana","int"],["athletics","Athletics","str"],["deception","Deception","cha"],["history","History","int"],["insight","Insight","wis"],["intimidation","Intimidation","cha"],["investigation","Investigation","int"],["medicine","Medicine","wis"],["nature","Nature","int"],["perception","Perception","wis"],["performance","Performance","cha"],["persuasion","Persuasion","cha"],["religion","Religion","int"],["sleightOfHand","Sleight of Hand","dex"],["stealth","Stealth","dex"],["survival","Survival","wis"]];
const ABIL=[["str","Strength"],["dex","Dexterity"],["con","Constitution"],["int","Intelligence"],["wis","Wisdom"],["cha","Charisma"]];
const FULL_SLOTS=[[],[2],[3],[4,2],[4,3],[4,3,2],[4,3,3],[4,3,3,1],[4,3,3,2],[4,3,3,3,1],[4,3,3,3,2],[4,3,3,3,2,1],[4,3,3,3,2,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1,1],[4,3,3,3,3,1,1,1,1],[4,3,3,3,3,2,1,1,1],[4,3,3,3,3,2,2,1,1]];

  const feats=Object.entries(c.feats||{}).flatMap(([l,ns])=>(ns||[]).map(n=>({id:slug(n)+"-"+l,name:n,level:+l,text:R.featureText[n]||""})));

function addPack(p,src){
  const pid=slug(p.id||p.name||src||"pack")||"pack";const abbr=(p.source&&p.source.abbr)||p.name||pid;
  const info={id:pid,name:p.name||pid,src:src,counts:{}};R.byPack[pid]={};
  const put=(coll,e)=>{const id=slug(e.id||e.name||"");if(!id)return;e=Object.assign({},e,{id:id,name:e.name||id,_pack:pid,_src:abbr});
    // Option lists (invocations, fighting styles, maneuvers…) grow across books instead of replacing each other.
    if(coll==="optionSets"&&R.optionSets[id]){const opts=(R.optionSets[id].options||[]).slice();(e.options||[]).forEach(o=>{const oid=o.id||slug(o.name);const i=opts.findIndex(x=>(x.id||slug(x.name))===oid);if(i>=0)opts[i]=o;else opts.push(o)});e.options=opts}
    (R.byPack[pid][coll]=R.byPack[pid][coll]||{})[id]=e;R[coll][id]=e;info.counts[coll]=(info.counts[coll]||0)+1};
  entriesOf(p.features).forEach(f=>{if(f.name)R.featureText[f.name]=f.text||f.sum||""});
  entriesOf(p.classes).forEach(c=>put("classes",c.hitDie?c:v1Class(c)));
  if(Array.isArray(p.subclasses))p.subclasses.forEach(s=>put("subclasses",s));
  else if(p.subclasses&&typeof p.subclasses==="object")Object.entries(p.subclasses).forEach(([cls,subs])=>Object.entries(subs||{}).forEach(([n,byLv])=>put("subclasses",{id:slug(n),name:n,class:slug(cls),

  ["races","backgrounds","feats","optionSets","items","creatures"].forEach(k=>entriesOf(p[k]).forEach(e=>put(k,e)));

async function loadLibrary(){
  R=emptyR();PACK_INFO=[];

  const [sp,it,base]=await Promise.all([get("data/srd-spells.json"),get("data/srd-items.json"),get("data/base-pack.json")]);
  if(sp)addPack({id:"srd",name:"SRD 5.1 spells",source:{abbr:"SRD 5.1"},spells:sp},"Built in");
  if(it)addPack({id:"srd-items",name:"SRD 5.1 magic items",source:{abbr:"SRD 5.1"},items:it},"Built in");
  if(base)addPack(base,"Built in");else setTimeout(()=>toast("Couldn't load data/base-pack.json, so classes and races are missing. Run the ledger from tools/serve.py.",true),500);
  // Packs made from your own books live in the git-ignored packs/ folder. They load by loadOrder (default 50),
  // so a newer book that reprints monsters (Monsters of the Multiverse) wins over the older ones.
  try{const r=await fetch("api/packs",{cache:"no-cache"});if(r.ok){const j=await r.json();const got=[];for(const f of j.files||[]){const p=await get("packs/"+encodeURIComponent(f));if(p&&p.format==="dnd-content-pack")got.push([f,p])}

  try{PACKS=(await Store.list("packs")).map(p=>Object.assign(p,{id:p._id||p.id}))}catch(e){PACKS=[]}
  PACKS.forEach(p=>{try{addPack(p,"Uploaded")}catch(e){}});

/* ================= FORMULAS =================
   Amounts are numbers, formulas ("max(1, mod.cha)", "1d10 + classLevel") or level scales ({"1":"d6","5":"d8"}).
   A formula with dice comes back as a dice string ready to roll; anything else comes back as a number. */
function scalePick(s,L){let best=null,bk=-1;for(const k in s){if(k==="by")continue;const n=+k;if(n<=L&&n>bk){bk=n;best=s[k]}}return best}
function amount(v,ctx){
  if(v==null)return null;if(typeof v==="number")return v;
  if(typeof v==="object"){const L=v.by==="level"||ctx.classLevel==null?ctx.level:ctx.classLevel;const x=scalePick(v,L);return x==null?null:amount(x,ctx)}
  return formula(String(v),ctx);
}
function ident(w,ctx){
  const sc=ctx.scores||{},m=a=>Math.floor(((sc[a]||10)-10)/2);let x;
  if(w==="prof")return ctx.prof;if(w==="level")return ctx.level;if(w==="classLevel")return ctx.classLevel!=null?ctx.classLevel:ctx.level;
  if((x=/^mod\.(str|dex|con|int|wis|cha)$/.exec(w)))return m(x[1]);
  if((x=/^score\.(str|dex|con|int|wis|cha)$/.exec(w)))return sc[x[1]]||10;
  if((x=/^level\.([a-z0-9-]+)$/.exec(w))){const k=(ctx.classes||[]).find(k=>k.class===x[1]);return k?k.level:0}
  if((x=/^col\.([A-Za-z0-9]+)$/.exec(w))){const d=ctx.cls&&ref("classes",ctx.cls);const t=d&&d.table&&d.table[x[1]];const v=t?t[Math.max(0,Math.min(19,(ctx.classLevel||1)-1))]:null;return v==null?0:v}
  if(w==="spellMod"||w==="spellDC"||w==="spellAttack"){const a=ctx.spellAbility||"int";const mm=m(a);return w==="spellMod"?mm:w==="spellDC"?8+ctx.prof+mm+(ctx.dcBonus||0):ctx.prof+mm+(ctx.atkBonus||0)}
  return null;
}
function formula(src,ctx){
  const toks=src.match(/\d*d\d+|\d+(?:\.\d+)?|[A-Za-z][\w.-]*|>=|<=|==|!=|[-+*\/(),<>]/g)||[];
  let hasDice=toks.some(t=>/^\d*d\d+$/.test(t));
  const vals=toks.map(t=>{if(/^\d*d\d+$/.test(t))return t;if(/^[A-Za-z]/.test(t)&&!/^(min|max|floor|ceil|and|or)$/.test(t)){const v=ident(t,ctx);if(v==null){(ctx.unknown=ctx.unknown||[]).push(t);return 0}if(typeof v==="string"&&/d/.test(v))hasDice=true;return v}return t});
  if(hasDice)return vals.join(" ").replace(/\s+/g," ").replace(/\+ -/g,"- ").replace(/\( /g,"(").replace(/ \)/g,")").trim();
  let i=0;const peek=()=>vals[i],next=()=>vals[i++];
  const prim=()=>{const t=next();if(t==="("){const v=expr();next();return v}if(t==="-")return -prim();
    if(t==="min"||t==="max"||t==="floor"||t==="ceil"){next();const a=[expr()];while(peek()===","){next();a.push(expr())}next();return t==="floor"?Math.floor(a[0]):t==="ceil"?Math.ceil(a[0]-1e-9):Math[t](...a)}
    return typeof t==="number"?t:parseFloat(t)||0};
  const mul=()=>{let v=prim();while(peek()==="*"||peek()==="/"){const o=next(),r=prim();v=o==="*"?v*r:v/(r||1)}return v};
  const add=()=>{let v=mul();while(peek()==="+"||peek()==="-"){const o=next(),r=mul();v=o==="+"?v+r:v-r}return v};
  const cmp=()=>{let v=add();while([">=","<=","==","!=",">","<"].includes(peek())){const o=next(),r=add();v=+(o===">="?v>=r:o==="<="?v<=r:o==="=="?v===r:o==="!="?v!==r:o===">"?v>r:v<r)}return v};
  const and=()=>{let v=cmp();while(peek()==="and"){next();const r=cmp();v=+(!!v&&!!r)}return v};
  const expr=()=>{let v=and();while(peek()==="or"){next();const r=and();v=+(!!v||!!r)}return v};
  try{const v=expr();return Math.floor(v+1e-9)}catch(e){return 0}
}
// Rolls "2d6 + 1d8 + 3". crit doubles the dice.
function rollExpr(expr,crit){
  let total=0;const parts=[];String(expr||"").replace(/\s+/g,"").replace(/([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g,(m,s1,n,f,s2,c)=>{

    else{const v=(s2==="-"?-1:1)*+c;total+=v;parts.push(sg(v))}return m});
  return{total:total,text:parts.join(" ")};

/* ================= STORE (db capability, else this browser) ================= */
const LK="dnd-ledger:";
const Store={
  db:null,mode:"memory",mem:{},
  async init(){
    try{ if(window.claude&&window.claude.use){ this.db=await window.claude.use("db"); } }catch(e){ this.db=null; }
    if(this.db){this.mode="db";return}
    try{localStorage.setItem(LK+"probe","1");localStorage.removeItem(LK+"probe");this.mode="local"}catch(e){this.mode="memory"}
  },
  async get(path){
    if(this.mode==="db"){const s=await this.db.doc(path).get();return s.exists?clone(s.data()):null}
    if(this.mode==="local"){try{const v=localStorage.getItem(LK+path);return v?JSON.parse(v):null}catch(e){return null}}
    return this.mem[path]?clone(this.mem[path]):null;
  },
  async set(path,data){
    if(this.mode==="db")return this.db.doc(path).set(data);
    if(this.mode==="local"){localStorage.setItem(LK+path,JSON.stringify(data));return}
    this.mem[path]=clone(data);
  },
  async del(path){
    if(this.mode==="db")return this.db.doc(path).delete();
    if(this.mode==="local"){localStorage.removeItem(LK+path);return}
    delete this.mem[path];
  },
  async list(coll){
    if(this.mode==="db"){const q=await this.db.collection(coll).get();return q.docs.map(d=>Object.assign({},clone(d.data()),{_id:d.id}))}
    const out=[];const pre=coll+"/";
    const keys=this.mode==="local"?Object.keys(localStorage).filter(k=>k.startsWith(LK)).map(k=>k.slice(LK.length)):Object.keys(this.mem);
    for(const k of keys){if(k.startsWith(pre)&&!k.slice(pre.length).includes("/")){const v=await this.get(k);if(v)out.push(Object.assign(v,{_id:k.slice(pre.length)}))}}
    return out;
  },
  watch(path,isColl,fn){
    if(this.mode!=="db")return;
    try{const ref=isColl?this.db.collection(path):this.db.doc(path);ref.onSnapshot(fn,()=>{})}catch(e){}
  }
};
const pending={};
function persist(path,getData,delay=250){
  clearTimeout(pending[path]);
  pending[path]=setTimeout(async()=>{
    try{await Store.set(path,getData())}catch(e){toast("Couldn't save ("+(e&&e.code||"error")+"). Your last change may not be kept; export a backup.",true)}
    finally{delete pending[path]}
  },delay);
}

/* ================= EDITING LOGGED ACTIONS ================= */
// An edit works out what the entry did to the character before and after the change and applies only the
// difference, so HP, slots, inspiration, ammo, coin and XP stay right. Each entry keeps its old values.
const EDIT_LABEL={title:"title",detail:"details",t:"time",r:"round",s:"session",undone:"crossed out",hit:"hit or miss",dmg:"damage",slot:"spell slot",amt:"amount",coin:"coins",xp:"XP",xpNote:"XP note"};
const toLocalInput=t=>{const d=new Date(t);if(isNaN(d))return "";const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes())};
function evAmt(e){if(e.amt!=null)return e.amt;const m=/^(?:Took|Healed) (\d+)/.exec(e.title||"");return m?+m[1]:0}
function evCoin(e){if(e.coin)return e.coin;if(e.k!=="item")return null;const m=/^(Gained|Spent) ([\d.]+) (pp|gp|ep|sp|cp)(?:: (.*))?$/.exec(e.title||"");return m?{dir:m[1]==="Gained"?1:-1,amt:+m[2],d:m[3],note:m[4]||""}:null}
function evEffect(e){
  const f={slots:{},hp:0,res:{},ammo:0,coin:null,xp:0,cond:null,insp:null,conc:null,death:{s:0,f:0},item:null,lost:null};if(!e||e.undone)return f;
  const t=e.title||"",d=e.detail||"",add=(id,n)=>{id=resId(id);f.res[id]=(f.res[id]||0)+n};let m;
  // Entries logged since version 2 record exactly what they spent; older ones are read from their text.
  if(e.fx){Object.entries(e.fx.res||{}).forEach(([id,n])=>add(id,n));Object.entries(e.fx.slots||{}).forEach(([l,n])=>{f.slots[l]=(f.slots[l]||0)+n});if(e.fx.hp)f.hp=e.fx.hp}
  if(e.k==="spell"&&e.spell){if(e.slot>0)f.slots[e.slot]=(f.slots[e.slot]||0)+1;if(!e.fx&&/^Pact slot/.test(d))add("pact",1);if(!e.fx&&/^Merge with Stone/.test(d))add(e.spell==="pass-without-trace"?"pwt":"bladeward",1);
    if(/Concentrating/.test(d)){const sp=knownSpells().find(x=>x.key===e.spell);f.conc={key:e.spell,name:sp?sp.name:t.split(" → ")[0]}}}
  if((m=/^(Spent|Restored) a (\d+)\w\w-level slot/.exec(t)))f.slots[+m[2]]=m[1]==="Spent"?1:-1;
  if(e.k==="feature"&&(m=/^(Spent|Restored) (.+)$/.exec(t))){const r=resources(C).find(x=>x.name===m[2]);if(r)add(r.id,m[1]==="Spent"?1:-1)}
  if(!e.fx&&e.k==="feature"&&!/^(Spent|Restored) /.test(t)){const r=resources(C).find(x=>x.name===t);if(r)add(r.id,1)}
  if(!e.fx&&/^Bardic Inspiration →/.test(t))add("bi",1);
  if(!e.fx&&/^Played the Rhythm-Maker's Drum/.test(t)){add("drum",1);add("bi",-1)}
  if(e.k==="hp"&&/^Took \d+ damage/.test(t)){const ab=+((/(\d+) absorbed by temp HP/.exec(d)||[])[1]||0);f.hp=-Math.max(0,evAmt(e)-ab)}
  if(e.k==="hp"&&/^Healed \d+/.test(t))f.hp=evAmt(e);
  if(e.k==="hp"&&/^Death save (success|failure)/.test(t))f.death[/success/.test(t)?"s":"f"]=1;
  if(e.k==="attack"){if(e.ammo)f.ammo=1;if(!e.fx&&/Psychic Blades/.test(d))add("bi",1)}
  if(e.k==="note"&&(m=/^(Now|No longer) (.+)$/.exec(t))){const c=CONDITIONS.find(x=>x.toLowerCase()===m[2].toLowerCase());if(c)f.cond={name:c,on:m[1]==="Now"}}
  if(e.k==="note"&&/^Gained Inspiration from the DM/.test(t))f.insp=true;
  if(e.k==="note"&&/^Used Inspiration/.test(t))f.insp=false;
  if(e.k==="item"&&(m=/^Got (?:(\d+) × )?(.+)$/.exec(t)))f.item=e.item||{name:m[2],qty:+(m[1]||1)};
  if(e.k==="item"&&(m=/^Lost or sold (.+)$/.exec(t)))f.lost=e.itemData||{name:m[1],qty:1};
  f.coin=evCoin(e);if(e.xp)f.xp=e.xp;
  return f;
}
function restAfter(e,longOnly){const i=EVENTS.indexOf(e);if(i<0)return false;return EVENTS.slice(i+1).some(x=>!x.undone&&x.k==="rest"&&(!longOnly||x.title==="Long rest"))}
function laterThan(e,fn){const i=EVENTS.indexOf(e);return i>=0&&EVENTS.slice(i+1).some(x=>!x.undone&&fn(x,evEffect(x)))}
function applyEffectDiff(e,a,b){
  const out=[];let held=false,stale=false;const J=JSON.stringify;
  if(J(a.coin)!==J(b.coin)){let g=C.gold; // coin first: it can fail if the money is already gone
    if(a.coin){const r=coinApply(g,-a.coin.dir,a.coin.amt,a.coin.d);if(!r)return{err:C.name+" no longer has the "+a.coin.amt+" "+a.coin.d+" this entry added, so it can't be taken back."};g=r.g}
    if(b.coin){const r=coinApply(g,b.coin.dir,b.coin.amt,b.coin.d);if(!r)return{err:"That's more coin than "+C.name+" has ("+coinStr(g)+")."};g=r.g}
    C.gold=g;out.push("coins "+coinStr(g))}
  const longGone=restAfter(e,true);
  Object.keys(Object.assign({},a.slots,b.slots)).forEach(l=>{const d=(b.slots[l]||0)-(a.slots[l]||0);if(!d)return;if(longGone){held=true;return}
    const m=slots(C)[l-1]||0;ST.slotsUsed[l]=Math.max(0,Math.min(m,(ST.slotsUsed[l]||0)+d));out.push(ord(+l)+"-level slots "+slotLeft(+l)+"/"+m)});
  Object.keys(Object.assign({},a.res,b.res)).forEach(id=>{const d=(b.res[id]||0)-(a.res[id]||0);const r=getRes(id);if(!d||!r)return;id=r.id;
    if(restAfter(e,r.rec!=="short")){held=true;return}ST.used[id]=Math.max(0,Math.min(r.max,(ST.used[id]||0)+d));out.push(r.name+" "+resLeft(r)+"/"+r.max)});
  if(b.hp!==a.hp){if(longGone)held=true;else{const was=ST.hp;ST.hp=Math.max(0,Math.min(maxHP(C),ST.hp+(b.hp-a.hp)));out.push("HP "+was+" → "+ST.hp)}}
  ["s","f"].forEach(k=>{const d=b.death[k]-a.death[k];if(d){ST.death=ST.death||{s:0,f:0};ST.death[k]=Math.max(0,Math.min(3,(ST.death[k]||0)+d));out.push("death saves "+ST.death.s+" ✓ "+ST.death.f+" ✗")}});
  // Toggles (conditions, DM Inspiration, concentration) only change if nothing later set them again.
  if(J(a.cond)!==J(b.cond)){const c=(a.cond||b.cond).name;
    if(laterThan(e,(x,fx)=>fx.cond&&fx.cond.name===c))stale=true;
    else{const on=b.cond?b.cond.on:!a.cond.on;const has=ST.conditions.includes(c);if(on&&!has)ST.conditions=ST.conditions.concat([c]);if(!on&&has)ST.conditions=ST.conditions.filter(x=>x!==c);out.push(on?c+" added":c+" removed")}}
  if(a.insp!==b.insp){if(laterThan(e,(x,fx)=>fx.insp!==null))stale=true;else{ST.inspiration=b.insp!==null?b.insp:!a.insp;out.push(ST.inspiration?"Inspiration on":"Inspiration off")}}
  if(J(a.conc)!==J(b.conc)){if(laterThan(e,(x,fx)=>fx.conc||/^Stopped concentrating/.test(x.title)||x.title==="Long rest"))stale=true;
    else if(b.conc){ST.conc={name:b.conc.name,key:b.conc.key,since:e.t,round:e.r||null};out.push("concentrating on "+b.conc.name)}
    else if(ST.conc&&ST.conc.key===a.conc.key){ST.conc=null;out.push("concentration on "+a.conc.name+" ended")}}
  if(b.ammo!==a.ammo){const it=e.ammoName?(C.inventory||[]).find(i=>itemName(i)===e.ammoName):ammoItem(allAttacks().find(x=>x.ammo)||{});if(it){it.qty=Math.max(0,(it.qty||0)-(b.ammo-a.ammo));out.push(itemName(it).toLowerCase()+" "+it.qty)}}
  if(J(a.item)!==J(b.item)){const take=(it,sign)=>{const ex=C.inventory.find(i=>itemName(i)===it.name);if(sign>0){if(ex)ex.qty=(ex.qty||0)+it.qty;else C.inventory.push({id:"i"+uid(),name:it.name,qty:it.qty,note:it.note||""})}
      else if(ex){ex.qty=(ex.qty||1)-it.qty;if(ex.qty<=0)C.inventory=C.inventory.filter(i=>i!==ex)}};
    if(a.item){take(a.item,-1);out.push(a.item.name+" removed from gear")}if(b.item){take(b.item,1);out.push(b.item.name+" added to gear")}}
  if(J(a.lost)!==J(b.lost)){const ln=x=>x.name||itemName(x);if(a.lost&&!C.inventory.some(i=>itemName(i)===ln(a.lost))){C.inventory.push(Object.assign({id:"i"+uid(),qty:1},a.lost));out.push(ln(a.lost)+" back in gear")}
    if(b.lost){C.inventory=C.inventory.filter(i=>itemName(i)!==ln(b.lost));out.push(ln(b.lost)+" removed from gear")}}
  if(b.xp!==a.xp){C.xp=Math.max(0,xpNow(C)+(b.xp-a.xp));out.push(C.xp.toLocaleString()+" XP")}
  if(held)out.push("you've rested since, so today's HP and uses weren't changed");
  if(stale)out.push("a later entry changed the same thing, so it was left as is");
  return{out:out};
}
// Session Entries hold a copy of their session's log, so they're rebuilt from the edited log.
function refreshEntries(sids){

  new Set(sids.filter(Boolean)).forEach(sid=>{const en=ENTRIES.find(x=>(x.sessionId||x.id)===sid);if(!en)return;
    let evs=EVENTS.filter(e=>e.s===sid);let tr=false;if(evs.length>700){evs=evs.slice(-700);tr=true}
    en.log=clone(evs);en.logTrimmed=tr;en.stats=sessionStats(evs);en.updated=now;saveEntry(en)});
}

        autoD=/^(Critical hit|Hit|Miss)/.test(e.detail||"")?(e.detail||"").replace(/^(Critical hit|Hit|Miss)(, -?\d+ damage)?/,rt):rt+(e.detail?" · "+e.detail:"")}
      if(isCast){const l=+segVal(m,"ee-slot");n.slot=l;const parts=(e.detail||"").split(" · ");const howRe=/^(\d+\w\w-level slot|Cantrip|At will.*|No slot)$/;

      // the "Now …" total on the latest coin or XP line follows the change

      saveChar();saveState();refreshEntries([oldS,e.s]);

/* ================= GITHUB BACKUP ON CLOSE ================= */
// Closing a session queues a dated backup in the db. A scheduled task in Claude Code commits it to
// your repo as backups/<closed date>-session-<n>.json; the page asks it to run right away
// through the Claude Code Remote connector, and a daily run catches anything missed.
async function queueBackup(s){
  const d=today(),id=d+"-session-"+s.number;
  if(Store.mode!=="db"){const doc={session:s.number,sessionId:s.id,closed:new Date().toISOString(),closedDate:d,file:"backups/"+id+".json",status:"queued"};
    BACKUPS=BACKUPS.filter(b=>b.id!==id).concat([Object.assign({id:id},doc)]);return localBackup(id)}
  const doc={session:s.number,sessionId:s.id,closed:new Date().toISOString(),closedDate:d,file:"backups/"+id+".json",status:"queued"};
  try{await Store.set("backups/"+id,doc);BACKUPS=BACKUPS.filter(b=>b.id!==id).concat([Object.assign({id:id},doc)])}
  catch(e){toast("Couldn't queue the GitHub backup ("+(e&&e.code||"error")+"). Export one from the Backup tab.",true);return}
  pokeBackup(id);
}
const BK_NOTE={};
// Run as the Mac app (tools/serve.py), the page hands the backup to the local server, which commits
// and pushes it with this computer's git login. Anywhere else it downloads the file instead.
async function localBackup(id){
  const b=BACKUPS.find(x=>x.id===id);if(!b)return;const data=exportObj();
  try{const r=await fetch("api/backup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({file:b.file,message:"Ledger backup after session "+b.session+" (closed "+b.closedDate+")",data:data})});
    const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||("HTTP "+r.status));
    Object.assign(b,{status:j.pushed?"saved":"failed",commit:j.commit||"",commitUrl:j.commitUrl||"",savedAt:new Date().toISOString(),error:j.pushed?"":"Committed on this Mac but not pushed to GitHub. Push it from GitHub Desktop."});
    toast(j.pushed?"Backup saved to GitHub.":"Backup committed on this Mac; push it from GitHub Desktop.",!j.pushed);
  }catch(e){b.status="failed";b.error="No local backup server, so the file was downloaded instead.";offerFile("ledger-"+id+".json",JSON.stringify(data,null,1))}
  const o=Object.assign({},b);delete o.id;delete o._id;try{await Store.set("backups/"+id,o)}catch(e){}
  requestRender();
}
async function pokeBackup(id){
  let cfg=null;try{cfg=await Store.get("app/config")}catch(e){}
  const tid=cfg&&cfg.backupTrigger;if(!tid){BK_NOTE[id]="It will be saved on the next daily backup run.";requestRender();return}
  try{const mcp=window.claude&&await window.claude.use("mcp");if(!mcp)throw{code:"unavailable"};
    await mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:tid,text:"Backup queued: "+id});
    BK_NOTE[id]="Saving to GitHub now.";
  }catch(e){const c=e&&e.code;BK_NOTE[id]=c==="not_in_manifest"||c==="approval_required"||c==="consent_required"?"Not sent yet because the page wasn't allowed to start the backup. It will still be saved on the daily run.":c==="server_not_connected"?"Claude Code isn't reachable from this page, so it will be saved on the daily run.":"Couldn't start the backup just now ("+(c||"error")+"). It will be saved on the daily run."}
  requestRender();
}
function backupFor(sessionId){return BACKUPS.filter(b=>b.sessionId===sessionId).sort((a,b)=>(b.closed||"").localeCompare(a.closed||""))[0]||null}
function backupHTML(b){if(!b)return "";
  if(b.status==="saved")return `<span class="tag ok-tag">Backed up to GitHub</span>${b.commitUrl?` <a href="${esc(b.commitUrl)}" target="_blank" rel="noopener" style="font-size:.82rem">${esc(b.file||"commit")}</a>`:""}`;
  if(b.status==="failed")return `<span class="tag" style="color:var(--danger)">GitHub backup failed</span> <span class="muted" style="font-size:.8rem">${esc(b.error||"")}</span> <button class="btn ghost small" data-bkretry="${esc(b.id)}">Try again</button>`;
  return `<span class="tag">GitHub backup queued</span> <span class="muted" style="font-size:.8rem">${esc(BK_NOTE[b.id]||"Waiting for the backup run.")}</span>`}

/* ================= CHOICES =================
   One widget per choice kind, used by level up and by the Sheet's "Choices" card. */
function choiceOptions(ch,d){
  const f=ch.from||{};const have=[].concat(ch.value&&!ch.value.skipped?ch.value:[]);
  if(ch.kind==="option"){const set=f.optionSet&&ref("optionSets",f.optionSet);return (set?set.options:[]).map(o=>[o.id||slug(o.name),o.name,o.text||""])}
  if(ch.kind==="skill"||ch.kind==="expertise"){let ids=Array.isArray(f.skills)?f.skills.filter(x=>x!=="any"):[];
    if(f.skills==="any"||(Array.isArray(f.skills)&&f.skills.includes("any")))ids=SKILLS.map(s=>s[0]);
    if(f.skills==="proficient"){ids=SKILLS.map(s=>s[0]).filter(s=>d.prof.skills.has(s));if(d.prof.tools.some(t=>/thieves/i.test(t)))ids.push("thievesTools")}
    if(ch.kind==="skill")ids=ids.filter(s=>!d.prof.skills.has(s)||have.includes(s));if(ch.kind==="expertise")ids=ids.filter(s=>!d.prof.expertise.has(s)||have.includes(s));
    return ids.map(s=>[s,s==="thievesTools"?"Thieves' tools":(SKILLS.find(x=>x[0]===s)||[0,s])[1],""])}
  if(ch.kind==="ability")return (f.abilities||ABIL.map(a=>a[0])).map(a=>[a,(ABIL.find(x=>x[0]===a)||[0,a])[1],""]);
  if(ch.kind==="feat")return Object.values(R.feats).filter(x=>!(f.ids&&f.ids.length)||f.ids.includes(x.id)).map(x=>[x.id,x.name,x.text||""]);
  if((ch.kind==="language"||ch.kind==="tool")&&f.list&&!f.list.includes("any"))return f.list.map(x=>[x,x,""]);
  if(ch.kind==="spell"){const sf=f.spells||{};const maxL=sf.level!=null?sf.level:sf.maxLevel==="slot"?Math.max(d.slots.length,d.pact?d.pact.lvl:0):sf.maxLevel!=null?sf.maxLevel:9;
    const list=sf.list&&sf.list!=="any"?slug(sf.list):null;
    return Object.values(R.spells).filter(s=>(sf.level!=null?s.lvl===sf.level:s.lvl<=maxL&&(sf.level===0||s.lvl>0||maxL===0))&&(!list||(s.classes||[]).some(c=>slug(c)===list))&&(!sf.school||slug(s.school||"")===slug(sf.school)))
      .sort((a,b)=>a.lvl-b.lvl||a.name.localeCompare(b.name)).map(s=>[s.id,s.name+(s.lvl?" ("+ord(s.lvl)+")":" (cantrip)"),""])}
  return null;
}

function readChoice(m,ch,pfx){

  if(ch.kind==="asi"){const mode=segVal(m,pfx+slug(ch.key)+"-m");const g=k=>box.querySelector('[data-asi="'+k+'"]').value;
    if(mode==="feat")return g("feat")?{v:{feat:g("feat")}}:{err:"Choose a feat for "+ch.name+"."};
    if(mode==="split"){if(g("b")===g("c"))return{err:"Pick two different scores for +1 each."};return{v:{abilities:{[g("b")]:1,[g("c")]:1}}}}
    return{v:{abilities:{[g("a")]:2}}}}

  if(t){const s=t.value.trim();if(!s)return{none:true};return{v:ch.kind==="text"?s:s.split(/\s*,\s*/).filter(Boolean)}}
  const v=[...box.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value);
  if(!v.length)return{none:true};if(v.length>n)return{err:"Choose at most "+n+" for "+ch.name+"."};return{v:v};
}
const choiceDone=ch=>ch.value!=null&&(ch.value.skipped||ch.kind==="asi"||ch.kind==="text"||[].concat(ch.value).length>=(ch.n||1));
function choiceSummary(ch){const v=ch.value;if(v==null)return "";if(v.skipped)return "Skipped";
  if(ch.kind==="asi")return v.feat?"Feat: "+((ref("feats",v.feat)||{}).name||v.feat):Object.entries(v.abilities||{}).map(([a,n])=>"+"+n+" "+a.toUpperCase()).join(", ");
  const opts=choiceOptions(Object.assign({},ch,{value:null}),D())||[];return [].concat(v).map(x=>{const o=opts.find(y=>y[0]===x);return o?o[1]:(ref("spells",x)||{}).name||x}).join(", ")}
function choiceModal(key){
  const d=D();const ch=d.choices.find(x=>x.key===key);if(!ch)return;
  openModal(`<h2>${esc(ch.name)}</h2>${choiceHTML(ch,d,"cm-")}<div id="cm-w"></div>
   <div class="modal-f"><button class="btn ghost" id="cm-skip">Skip it</button><button class="btn" data-close>Cancel</button><button class="btn primary" id="cm-ok">Save</button></div>`,m=>{
    bindChoice(m,ch,"cm-");

    m.querySelector("#cm-ok").onclick=()=>{const r=readChoice(m,ch,"cm-");if(r.err){m.querySelector("#cm-w").innerHTML='<div class="warn bad">'+esc(r.err)+'</div>';return}
      if(r.none){delete C.choices[key]}else{if(ch.kind==="asi"&&C.abilityMode!=="base")applyAsiFinal(r.v,ch.value);C.choices[key]=r.v}
      saveChar();closeModal();log("level",ch.name+": "+(r.none?"cleared":choiceSummary(Object.assign({},ch,{value:r.v}))),ch.src||"",null)};
  });

// With "final" scores, an ASI changes the stored scores directly (base scores get it from the choice).
function applyAsiFinal(v,old){
  const apply=(x,sign)=>{if(!x)return;if(x.abilities)Object.entries(x.abilities).forEach(([a,n])=>{C.abilities[a]=Math.max(1,Math.min(sign>0?20:30,C.abilities[a]+sign*n))});
    if(x.feat){const ft=ref("feats",x.feat);(ft&&ft.effects||[]).concat(...((ft&&ft.features)||[]).map(f=>f.effects||[])).forEach(e=>{if(e.type==="abilityScore")C.abilities[e.ability]=Math.min(e.max||20,C.abilities[e.ability]+sign*e.add)})}};
  apply(old&&!old.skipped?old:null,-1);apply(v,1);
}

/* ================= LEVEL UP ================= */
function levelUp(){
  const tl=totalLv(C);if(tl>=20){toast("Already level 20.");return}
  const order=id=>{const i=C.classes.findIndex(k=>k.class===id);return i<0?99:i};
  const opts=Object.values(R.classes).sort((a,b)=>order(a.id)-order(b.id)||a.name.localeCompare(b.name));
  if(!opts.length){toast("No classes are loaded. Check data/base-pack.json.",true);return}
  const plan=C.levelPlan&&C.levelPlan[tl]?slug(C.levelPlan[tl]):null;
  const start=plan&&R.classes[plan]?plan:(C.classes[0]&&C.classes[0].class)||opts[0].id;
  const d0=D();const n0={};d0.choices.forEach(c=>n0[c.key]=c.n);
  // What the character looks like after the level, for previewing features and choices.
  const after=(cls,sub)=>{const t=clone(C);let k=t.classes.find(x=>x.class===cls);if(!k){k={class:cls,subclass:"",level:0};t.classes.push(k)}k.level+=1;if(sub!=null&&!k.subclass)k.subclass=sub;t.levelHistory.push(cls);return t};
  let cur={cls:start,sub:null};
  openModal(`<h2>Level up</h2>
    <div class="field"><span class="label">Class to advance</span><select id="lu-cls">${opts.map(o=>`<option value="${esc(o.id)}" ${o.id===start?"selected":""}>${esc(o.name)} ${lv(C,o.id)+1}${lv(C,o.id)?"":" (new class)"}</option>`).join("")}</select></div>
    ${plan?`<p class="muted" style="margin:0;font-size:.85rem">Your plan says ${esc(C.levelPlan[tl])} at character level ${tl+1}.</p>`:""}
    <div id="lu-body" class="stack"></div><div id="lu-w"></div>
    <div class="modal-f"><button class="btn" data-close>Cancel</button><button class="btn primary" id="lu-ok">Level up</button></div>`,m=>{
    let pending=[];
    const draw=()=>{const cls=cur.cls,def=R.classes[cls];const have=C.classes.find(k=>k.class===cls);const nl=(have?have.level:0)+1;
      const needSub=!(have&&have.subclass)&&nl>=(def.subclassLevel||3);
      const subs=Object.values(R.subclasses).filter(s=>s.class===cls).sort((a,b)=>a.name.localeCompare(b.name));
      const t=after(cls,needSub?(cur.sub||""):null);const d2=derive(t,ST);
      const k2=d2.classes.find(k=>k.class===cls);const newF=[].concat((def.features||[]).filter(f=>(f.level||1)===nl),k2&&k2.sub?(k2.sub.features||[]).filter(f=>(f.level||1)===nl):[]).filter(f=>!/^asi-/.test(f.id||""));
      pending=d2.choices.filter(ch=>!choiceDone(ch)&&(n0[ch.key]==null||ch.n>n0[ch.key]));
      const c1=d0.casters.find(x=>x.cls===cls),c2=d2.casters.find(x=>x.cls===cls);const notes=[];
      if(c2){const dd=(a,b)=>Math.max(0,(b||0)-(a||0));if(dd(c1&&c1.cantrips,c2.cantrips))notes.push("Learn "+dd(c1&&c1.cantrips,c2.cantrips)+" new cantrip"+(dd(c1&&c1.cantrips,c2.cantrips)>1?"s":""));
        if(c2.known!=null&&dd(c1&&c1.known,c2.known))notes.push("Learn "+dd(c1&&c1.known,c2.known)+" new spell"+(dd(c1&&c1.known,c2.known)>1?"s":"")+" (and you may swap one)");
        if(c2.spellbook!=null)notes.push("Add "+(c1?2:6)+" wizard spells to your spellbook");
        if(c2.prepared!=null&&dd(c1&&c1.prepared,c2.prepared))notes.push("Prepare "+c2.prepared+" spells (up from "+((c1&&c1.prepared)||0)+")")}
      if(d2.slots.length>d0.slots.length)notes.push("New: "+ord(d2.slots.length)+"-level spell slots");
      const mc=!have&&tl>0?def.multiclass||{}:null;
      const hd=def.hitDie||8,avg=hd/2+1;
      m.querySelector("#lu-body").innerHTML=`<p style="margin:0">${esc(def.name)} ${nl} · character level ${tl+1} · proficiency ${sg(Math.ceil((tl+1)/4)+1)}</p>
        ${mc?`<div class="warn">Multiclassing into ${esc(def.name)} needs ${esc(mc.text||"13 in its main ability")}${mc.requires&&!formula(mc.requires,{scores:d0.scores,prof:d0.pb,level:tl})?" (your scores don't meet it)":""}, plus your current class's requirement.</div>`:""}
        ${needSub?`<div class="field"><span class="label">${esc(def.subclassTitle||"Subclass")}</span><select id="lu-sub"><option value="">Choose…</option>${subs.map(s=>`<option value="${esc(s.id)}" ${cur.sub===s.id?"selected":""}>${esc(s.name)}${(s.features||[]).length?"":" (name only)"}</option>`).join("")}</select></div>`:""}
        <div class="field"><span class="label">New features</span><div>${newF.length?newF.map(x=>`<div class="feat"><b>${esc(x.name)}</b>${x.text?`<p>${esc(x.text)}</p>`:""}</div>`).join(""):'<span class="muted">No new class features at this level.</span>'}</div></div>
        ${pending.map(ch=>choiceHTML(ch,d2,"lu-")).join("")}
        ${notes.length?`<div class="warn">${esc(notes.join(". "))}. Do it on the Spells tab after leveling.</div>`:""}
        <div class="field"><span class="label">Hit points gained</span>${segHTML("hpm",[["avg","Average: "+avg+" "+sg(d2.M("con"))],["roll","I rolled"]],"avg")}<input id="lu-roll" class="num" inputmode="numeric" placeholder="Your d${hd} roll" hidden></div>`;
      bindSeg(m,"hpm",v=>{m.querySelector("#lu-roll").hidden=v!=="roll"});pending.forEach(ch=>bindChoice(m,ch,"lu-"));
      const ss=m.querySelector("#lu-sub");if(ss)ss.onchange=()=>{cur.sub=ss.value||null;draw()};};
    m.querySelector("#lu-cls").onchange=e=>{cur={cls:e.target.value,sub:null};draw()};draw();
    m.querySelector("#lu-ok").onclick=()=>{
      const cls=cur.cls,def=R.classes[cls];const hd=def.hitDie||8;const hpm=segVal(m,"hpm");let roll=hd/2+1;
      if(hpm==="roll"){roll=parseInt(m.querySelector("#lu-roll").value);if(!(roll>=1&&roll<=hd)){toast("Enter your d"+hd+" roll (1–"+hd+").");return}}
      const ss=m.querySelector("#lu-sub");if(ss&&!ss.value){m.querySelector("#lu-w").innerHTML='<div class="warn bad">Choose a '+esc((def.subclassTitle||"subclass").toLowerCase())+'.</div>';return}
      const answers={};for(const ch of pending){const r=readChoice(m,ch,"lu-");if(r.err){m.querySelector("#lu-w").innerHTML='<div class="warn bad">'+esc(r.err)+'</div>';return}if(!r.none)answers[ch.key]={v:r.v,ch:ch}}
      const before=begin();const oldMax=maxHP(C);
      let k=C.classes.find(x=>x.class===cls);if(!k){k={class:cls,subclass:"",level:0};C.classes.push(k)}
      if(C.hp.rolls&&C.hp.rolls.length&&C.hp.rolls.length===C.levelHistory.length)C.hp.rolls.push(roll);
      else if(hpm==="roll"&&!C.hp.max){C.hp.rolls=C.levelHistory.map((c,i)=>{const h=(ref("classes",c)||{}).hitDie||8;return i===0?h:h/2+1});C.hp.rolls.push(roll)}
      k.level+=1;C.levelHistory.push(cls);if(ss)k.subclass=ss.value;
      Object.entries(answers).forEach(([key,a])=>{if(a.ch.kind==="asi"&&C.abilityMode!=="base")applyAsiFinal(a.v,null);C.choices[key]=a.v});
      if(C.hp.max)C.hp.max+=roll+D().M("con")+D().sum("hp.perLevel");
      const gain=maxHP(C)-oldMax;ST.hp+=Math.max(0,gain);
      saveChar();closeModal();
      const nd=D();const nk=nd.classes.find(x=>x.class===cls);
      log("level","Reached "+def.name+" "+k.level+" (level "+totalLv(C)+")",["+"+gain+" max HP ("+maxHP(C)+")",ss?"Subclass: "+subName(k.subclass):"",
        ...Object.values(answers).map(a=>a.ch.name+": "+choiceSummary(Object.assign({},a.ch,{value:a.v})))].filter(Boolean).join(" · "),before);
      toast("Level "+totalLv(C)+"! "+(nd.casters.some(x=>x.cls===cls)?"Check the Spells tab for new spells.":"New features are on the Sheet tab."));
    };
  });
}

const COIN={pp:1000,gp:100,ep:50,sp:10,cp:1};

function coinTotal(g){return Object.keys(COIN).reduce((a,k)=>a+(g[k]||0)*COIN[k],0)}

   </section>`;

// Coin entries, newest first. Older entries (before e.coin existed) are recognised by their title.
function coinLedger(){
  return EVENTS.filter(e=>!e.undone&&e.k==="item"&&(e.coin||/^(Gained|Spent) [\d.]+ (pp|gp|ep|sp|cp)/.test(e.title))).map(e=>{
    if(e.coin)return{t:e.t,dir:e.coin.dir,amt:e.coin.amt+" "+e.coin.d,why:e.coin.note,now:e.detail};

  }).reverse();

function coinMove(dir){

// Returns {g, change} with the new purse, or null if there isn't enough.
function coinApply(gold,dir,a,d){
  const g=Object.assign({pp:0,gp:0,ep:0,sp:0,cp:0},gold);let change="";
  if(dir>0){const whole=Math.floor(a);g[d]=(g[d]||0)+whole;let rem=Math.round((a-whole)*COIN[d]);["sp","cp"].forEach(k=>{const n=Math.floor(rem/COIN[k]);g[k]=(g[k]||0)+n;rem-=n*COIN[k]})}
  else if(Number.isInteger(a)&&(g[d]||0)>=a){g[d]-=a}
  else{const left=coinTotal(g)-Math.round(a*COIN[d]);
    if(left<0)return null;
    // keep platinum and electrum if possible, make change in gp/sp/cp
    let rest=left;const out={pp:0,gp:0,ep:0,sp:0,cp:0};
    ["pp","ep"].forEach(k=>{const keep=Math.min(g[k]||0,Math.floor(rest/COIN[k]));out[k]=keep;rest-=keep*COIN[k]});
    ["gp","sp","cp"].forEach(k=>{out[k]=Math.floor(rest/COIN[k]);rest-=out[k]*COIN[k]});
    Object.assign(g,out);change=" (made change)"}
  Object.keys(g).forEach(k=>{if(!g[k])delete g[k]});if(!g.gp)g.gp=0;
  return{g:g,change:change};
}

     <div class="field"><span class="label">Background</span><select id="nc-bg"><option value="">Other (type it)</option>${bgs.map(b=>`<option value="${esc(b.id)}">${esc(b.name)}</option>`).join("")}</select><input id="nc-bgt" autocomplete="off" placeholder="Background name"></div></div>
    <div class="fgrid"><div class="field"><span class="label">Class</span><select id="nc-cls">${cl.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select></div><div class="field"><span class="label">Subclass (if you have one)</span><select id="nc-sub"></select></div></div>
    <div class="fgrid"><div class="field"><span class="label">Level</span><input id="nc-lvl" class="num" inputmode="numeric" value="1"></div><div class="field"><span class="label">Max HP (blank = average)</span><input id="nc-hp" class="num" inputmode="numeric" placeholder="auto"></div></div>
    <div class="field"><span class="label">Ability scores (as on your sheet, racial bonuses included)</span><div class="row" style="gap:6px;flex-wrap:wrap">${ab.map(([k,l,v])=>`<label style="display:flex;flex-direction:column;font-size:.75rem;font-weight:700;width:64px">${l}<input id="nc-${k}" class="num" inputmode="numeric" value="${v}" style="padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg)"></label>`).join("")}</div></div>
    <div class="fgrid"><div class="field"><span class="label">Armor</span><select id="nc-armor"><option value="">None</option>${armors.map(a=>`<option value="${esc(a.id)}">${esc(a.name)} (AC ${a.armor.base}${a.armor.dexCap===0?"":a.armor.dexCap?" + Dex max "+a.armor.dexCap:" + Dex"})</option>`).join("")}</select></div></div>
    <label class="check"><input type="checkbox" id="nc-shield"> Shield (+2 AC)</label>
    <div class="field"><span class="label">Skill proficiencies</span><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 10px">${SKILLS.map(sk=>`<label class="check" style="font-size:.85rem"><input type="checkbox" data-ncskill="${sk[0]}"> ${sk[1]}</label>`).join("")}</div></div>
    <div id="nc-w"></div>
    <div class="row"><button class="btn primary" id="nc-ok">Create character</button></div>
   </section></div><div class="col">
   <section class="card"><div class="card-h"><h2>Or load a file</h2></div>
    <p class="muted" style="margin:0;font-size:.86rem">A ledger backup restores everything (sheet, sessions, notes, full log). You can also load a character file: version 2 (<a href="docs/data-formats.md" target="_blank" rel="noopener">format</a>, <a href="data/examples/fighter-rogue-v2.json" target="_blank" rel="noopener">example</a>) or the older <a href="data/character-template.json" target="_blank" rel="noopener">template</a>.</p>
    <input type="file" id="e-imp" accept=".json,application/json"><div id="d-prev"></div>
    <div id="nc-example" class="stack"></div>
   </section></div></div>`;
  const subs=()=>{const c=$("#nc-cls").value;$("#nc-sub").innerHTML='<option value="">None yet</option>'+Object.values(R.subclasses).filter(s=>s.class===c).sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")};
  $("#nc-cls").onchange=subs;subs();
  const sync=()=>{$("#nc-racet").hidden=!!$("#nc-race").value;$("#nc-bgt").hidden=!!$("#nc-bg").value};$("#nc-race").onchange=sync;$("#nc-bg").onchange=sync;sync();
  [["data/example-character.json","example character"],["data/examples/fighter-rogue-v2.json","version 2 example"]].forEach(([u,l])=>fetch(u).then(r=>r.ok?r.json():null).then(o=>{if(!o)return;const b=document.createElement("button");b.className="btn";b.textContent="Try the "+l+" ("+((o.character||o).name||"example")+")";b.onclick=async()=>{try{await startLedger(ledgerFromFile(o),"Loaded the "+l)}catch(err){toast(String(err),true)}};$("#nc-example").append(b)}).catch(()=>{}));
  $("#e-imp").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{const o=ledgerFromFile(JSON.parse(rd.result));await startLedger(o,o.events&&o.events.length?null:"Character loaded from "+f.name)}catch(err){$("#d-prev").innerHTML='<div class="warn bad">Couldn\'t load that file: '+esc(err)+'</div>'}};rd.readAsText(f)};
  $("#nc-ok").onclick=async()=>{const v=id=>$("#"+id).value.trim();const w=$("#nc-w");
    const name=v("nc-name");if(!name){w.innerHTML='<div class="warn">Give your character a name.</div>';$("#nc-name").focus();return}
    const level=Math.max(1,Math.min(20,parseInt(v("nc-lvl"))||1)),cls=v("nc-cls");
    const c=blankCharacter();Object.assign(c,{name:name,player:v("nc-player"),background:v("nc-bg")||v("nc-bgt")});
    const rv=v("nc-race");if(rv){const[r,s]=rv.split("|");c.race=r;c.subrace=s||""}else c.race=v("nc-racet");
    ab.forEach(([k])=>{const n=parseInt(v("nc-"+k));c.abilities[k]=n>=1&&n<=30?n:10});
    c.classes=[{class:cls,subclass:v("nc-sub"),level:level}];c.levelHistory=Array(level).fill(cls);
    const hp=parseInt(v("nc-hp"));if(hp>0)c.hp.max=hp;
    if(v("nc-armor"))c.inventory.push({id:"i"+uid(),item:v("nc-armor"),qty:1,equipped:true});if($("#nc-shield").checked)c.inventory.push({id:"i"+uid(),item:"shield",qty:1,equipped:true});
    c.proficiencies.skills=[...document.querySelectorAll("[data-ncskill]:checked")].map(x=>x.dataset.ncskill);
    if(c.proficiencies.skills.length)c.choices[cls+"/skills"]={skipped:true};
    c.xp=XP_TABLE[level-1];
    await startLedger({format:"dnd-ledger",version:2,character:normalizeChar(c),state:null,sessions:[],notes:[],events:[]},"Created "+name);
  };
}
// Optional cover art: put an image at assets/cover.jpg, or set "cover" (an image URL) on the character.
function applyCover(){const el=$("#cover");if(!el||!C)return;const src=C.cover||"assets/cover.jpg";const im=new Image();
  im.onload=()=>{el.style.setProperty("--cover-img",'url("'+src.replace(/"/g,"")+'")');$("#cover-name").textContent=C.name;el.hidden=false};im.onerror=()=>{el.hidden=true};im.src=src}

/* ================= BOOT ================= */
function normalize(){
  normalizeChar(C);
  ST=Object.assign(defaultState(),ST||{});ST.used=ST.used||{};ST.slotsUsed=ST.slotsUsed||{};ST.hdUsed=ST.hdUsed||{};ST.conditions=ST.conditions||[];ST.death=ST.death||{s:0,f:0};ST.toggles=ST.toggles||[];ST.spellFx=ST.spellFx||[];
  if(ST.hp==null)ST.hp=maxHP(C);
}
function applyChunks(list){CHUNKS=list.map(d=>({id:d._id||d.id,n:d.n,events:d.events||[]})).sort((a,b)=>a.n-b.n);EVENTS=[].concat(...CHUNKS.map(c=>c.events))}
if("serviceWorker" in navigator&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&!window.claude){navigator.serviceWorker.register("sw.js").catch(()=>{})}
async function boot(){
  await Store.init();
  await loadLibrary();
  try{
    C=await Store.get("app/character");
    if(!C){renderEmpty();return}
    ST=await Store.get("app/state");
    // Version 1 data: keep a copy as it was, then convert. Nothing is deleted.
    if(C.schema!==2){
      try{if(!(await Store.get("app/character-v1")))await Store.set("app/character-v1",{character:C,state:ST,savedAt:new Date().toISOString()})}catch(e){}
      C=migrateCharacter(C,ST);ST=migrateState(ST);normalize();afterMigration();
      await Store.set("app/character",C);await Store.set("app/state",ST);
      setTimeout(()=>toast("Updated "+C.name+" to the new data format. The old copy is kept, and an export from Backup has everything."),800);
    }else normalize();
    const [ss,ns,ls,es,bs]=await Promise.all([Store.list("sessions"),Store.list("notes"),Store.list("log"),Store.list("entries"),Store.list("backups").catch(()=>[])]);
    BACKUPS=bs.map(b=>Object.assign(b,{id:b._id||b.id}));
    ENTRIES=es.map(e=>Object.assign(e,{id:e.id||e._id}));
    SESS=ss.map(s=>Object.assign(s,{id:s.id||s._id}));NOTES=ns.map(n=>Object.assign(n,{id:n.id||n._id}));applyChunks(ls);
  }catch(e){console.error(e);$("#view").innerHTML='<div class="empty">Couldn\'t open the saved data ('+esc(e&&e.code||e&&e.message||e)+'). Reload the page to try again.</div>';return}
  render();
  const live=(path,fn)=>Store.watch(path,false,snap=>{if(snap.metadata.hasPendingWrites||pending[path]||!snap.exists)return;fn(clone(snap.data()))});
  live("app/state",d=>{if(JSON.stringify(d)!==JSON.stringify(ST)){ST=d;normalize();requestRender()}});
  live("app/character",d=>{if(JSON.stringify(d)!==JSON.stringify(C)){C=d.schema===2?d:migrateCharacter(d,ST);normalize();requestRender()}});
  Store.watch("log",true,q=>{if(q.metadata.hasPendingWrites||Object.keys(pending).some(k=>k.startsWith("log/")))return;const list=q.docs.map(d=>Object.assign({},clone(d.data()),{_id:d.id}));const tot=list.reduce((a,c)=>a+(c.events||[]).length,0);
    const sg2=evs=>[evs.length,evs.filter(e=>e.undone).length,evs.reduce((a,e)=>a+(e.edits?e.edits.length:0),0)];const sig=JSON.stringify(list.map(c=>[c._id].concat(sg2(c.events||[]))));const mine=JSON.stringify(CHUNKS.map(c=>[c.id].concat(sg2(c.events))));
    if(sig!==mine&&tot>=0){applyChunks(list);requestRender()}});
  Store.watch("backups",true,q=>{if(q.metadata.hasPendingWrites)return;BACKUPS=q.docs.map(d=>Object.assign({},clone(d.data()),{id:d.id}));requestRender()});
  Store.watch("entries",true,q=>{if(q.metadata.hasPendingWrites||Object.keys(pending).some(k=>k.startsWith("entries/")))return;ENTRIES=q.docs.map(d=>Object.assign({},clone(d.data()),{id:d.id}));requestRender()});
  Store.watch("sessions",true,q=>{if(q.metadata.hasPendingWrites||Object.keys(pending).some(k=>k.startsWith("sessions/")))return;SESS=q.docs.map(d=>Object.assign({},clone(d.data()),{id:d.id}));requestRender()});
  Store.watch("notes",true,q=>{if(q.metadata.hasPendingWrites||Object.keys(pending).some(k=>k.startsWith("notes/")))return;NOTES=q.docs.map(d=>Object.assign({},clone(d.data()),{id:d.id}));requestRender()});
}
boot();
</script>
