<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>D&amp;D Ledger</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"><link rel="icon" href="assets/icons/icon-192.png"><meta name="theme-color" content="#2E6A4E"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>D&amp;D Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky vitals bar over a tabbed play surface; two columns on desktop, one on phones with bottom tabs. */
:root{
  --bg:#E9ECE6; --panel:#F7F8F4; --sunk:#E0E4DC; --ink:#1D2320; --muted:#5B645D; --line:#C9CFC5;
  --accent:#2E6A4E; --accent-ink:#FFFFFF; --gold:#9A6B12; --danger:#AE3528; --info:#2C5C8A; --psy:#6A4C9E; --ok:#2E7D4F;
  --f-display:"Alegreya SC", "Palatino Linotype", Georgia, serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131614; --panel:#1B1F1C; --sunk:#232825; --ink:#E7E2D4; --muted:#9BA196; --line:#313833;
  --accent:#71B28E; --accent-ink:#0E1511; --gold:#E0B04C; --danger:#E5735F; --info:#86AEDA; --psy:#AE91E0; --ok:#7CC496; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131614; --panel:#1B1F1C; --sunk:#232825; --ink:#E7E2D4; --muted:#9BA196; --line:#313833;
  --accent:#71B28E; --accent-ink:#0E1511; --gold:#E0B04C; --danger:#E5735F; --info:#86AEDA; --psy:#AE91E0; --ok:#7CC496; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.15rem}
h3{font-size:1rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.ident{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.ident h1{font-size:1.35rem;line-height:1.1}
.ident .sub{font-size:.82rem;color:var(--muted)}
.vitals{display:flex;gap:6px;flex-wrap:wrap}
.vital{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:54px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.vital b{font-family:var(--f-num);font-size:1.05rem;font-variant-numeric:tabular-nums}
.vital span{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.vital.hp{min-width:110px;position:relative;overflow:hidden}
.hpbar{position:absolute;left:0;bottom:0;height:3px;background:var(--ok)}
.hpbar.low{background:var(--danger)}
@media (max-width:600px){.top{position:static}.vital{min-width:48px;padding:3px 6px}.vital.hp{min-width:90px}}
.toprow2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:.82rem}
.pill.live{border-color:var(--accent);color:var(--accent);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.sess-btn{font-size:.85rem;padding:6px 14px}
.sess-btn.live{background:var(--danger);border-color:var(--danger);color:#fff}
.sess-btn.live .dot{background:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.sess-meta{font-size:.8rem;color:var(--muted)}
.xp{display:flex;flex-direction:column;gap:3px;min-width:170px;flex:1 1 170px;max-width:300px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:left;font:inherit;color:inherit;cursor:pointer}
.xp:hover{border-color:var(--muted)}
.xp .xl{display:flex;justify-content:space-between;gap:8px;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.xp .xl b{font-family:var(--f-num);font-size:.8rem;letter-spacing:0;text-transform:none;color:var(--ink,inherit)}
.xp .xbar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.xp .xbar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.xp.ready{border-color:var(--gold)}
.xp .xn{font-size:.72rem;color:var(--muted)}
.ev .acts{display:flex;gap:4px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.ev-edit{border:1px solid transparent;background:none;color:var(--muted);font-size:.72rem;font-weight:700;padding:1px 6px;border-radius:6px;cursor:pointer}
.ev-edit:hover,.ev-edit:focus-visible{border-color:var(--line);color:var(--accent)}
.tag.ed{font-style:italic}
.tag.ok-tag{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 12px;border-bottom:3px solid transparent;font-weight:700;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main .wrap{padding-block:16px 96px}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-h h2{margin-right:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:8px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:4px 8px}
.btn.small{padding:4px 9px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .k{font-weight:400;color:var(--muted);font-size:.78rem}
.btn.primary .k{color:inherit;opacity:.8}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.qa{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.qa:hover{border-color:var(--accent)}
.qa b{font-size:.92rem}
.qa span{font-size:.76rem;color:var(--muted)}
.qa.psy{border-left:3px solid var(--psy)}
.qa.gold{border-left:3px solid var(--gold)}
.qa.info{border-left:3px solid var(--info)}
.qa:disabled{opacity:.45}

/* economy chips */
.econ{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:700;background:var(--bg)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.spent{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.chip.psy.on{background:var(--psy);border-color:var(--psy)}

/* resource pips */
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.res:first-of-type{border-top:0}
.res .nm{font-weight:700;font-size:.9rem;min-width:0}
.res .meta{font-size:.74rem;color:var(--muted);grid-column:1/-1;margin-top:-2px}
.pips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.pip{width:20px;height:20px;border-radius:50%;border:2px solid var(--accent);background:var(--accent);padding:0}
.pip.used{background:transparent;border-color:var(--line)}
.pip.gold{border-color:var(--gold);background:var(--gold)}
.pip.gold.used{background:transparent;border-color:var(--line)}
.pip.psy{border-color:var(--psy);background:var(--psy)}
.pip.psy.used{background:transparent;border-color:var(--line)}
.tag{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.short{color:var(--info)}
.tag.long{color:var(--gold)}
.tag.conc{color:var(--psy)}
.tag.ba{color:var(--accent)}

/* hp */
.hpctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hpctl input{width:84px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--f-num);font-size:1.05rem}
.bighp{font-family:var(--f-num);font-size:2rem;font-weight:600;line-height:1}
.bighp small{font-size:1rem;color:var(--muted)}

/* log list */
.log{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.ev:first-child{border-top:0}
.ev .tm{font-family:var(--f-num);font-size:.75rem;color:var(--muted);padding-top:2px}
.ev .tt{font-weight:700;font-size:.92rem;min-width:0;overflow-wrap:anywhere}
.ev .dd{font-size:.82rem;color:var(--muted);grid-column:2/-1;overflow-wrap:anywhere;white-space:pre-wrap}
.ev.undone .tt,.ev.undone .dd{text-decoration:line-through;opacity:.6}
.kind{font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid currentColor;white-space:nowrap}
.k-attack{color:var(--danger)} .k-spell{color:var(--psy)} .k-feature{color:var(--gold)} .k-hp{color:var(--ok)}
.k-rest{color:var(--info)} .k-combat{color:var(--ink)} .k-note{color:var(--muted)} .k-level{color:var(--gold)} .k-item{color:var(--info)} .k-session{color:var(--accent)}
.sess-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:12px 0 6px;border-bottom:2px solid var(--ink);margin-top:8px}
.sess-h h3{font-size:1.05rem}

/* spells */
.slotrow{display:flex;gap:14px;flex-wrap:wrap}
.slotgrp{display:flex;flex-direction:column;gap:4px}
.spell{border-top:1px solid var(--line);padding:9px 0;display:flex;flex-direction:column;gap:6px}
.spell:first-child{border-top:0}
.spell-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spell-h .nm{font-weight:700;margin-right:auto;min-width:0}
.spell .facts{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.spell .facts b{color:var(--ink);font-weight:700}
.spell p{margin:0;font-size:.88rem;max-width:68ch}
.spell details summary{cursor:pointer;font-size:.8rem;color:var(--accent);font-weight:700;list-style:none}
.spell details summary::-webkit-details-marker{display:none}
.lvl-h{font-family:var(--f-display);font-size:1rem;margin-top:8px;padding-bottom:4px;border-bottom:2px solid var(--ink);display:flex;gap:10px;align-items:baseline}

/* sheet */
.abil{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:520px){.abil{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ab{border:1px solid var(--line);border-radius:9px;padding:8px 4px;text-align:center;background:var(--bg)}
.ab .m{font-family:var(--f-num);font-size:1.35rem;font-weight:600}
.ab .s{font-size:.78rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:.88rem}
.kv .v{font-family:var(--f-num);text-align:right}
.kv .p{color:var(--accent);font-weight:700}
.feat{border-top:1px solid var(--line);padding:8px 0}
.feat:first-child{border-top:0}
.feat b{font-size:.92rem}
.feat p{margin:3px 0 0;font-size:.86rem;max-width:70ch}
table.inv{width:100%;border-collapse:collapse;font-size:.88rem}
table.inv td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:middle}
table.inv td.q{white-space:nowrap;text-align:right}
.tbl{overflow-x:auto}

/* forms */
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field input,.field select,.field textarea{padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
.field textarea{min-height:90px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 11px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.note-card{border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.warn{border-left:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--panel));padding:8px 10px;border-radius:6px;font-size:.86rem}
.bad{border-left-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--panel))}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* modal */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
@media (min-width:700px){.scrim{align-items:center}}
.modal{background:var(--panel);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.modal{border-radius:14px}}
.modal-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:.88rem;max-width:min(92vw,520px);box-shadow:0 6px 20px rgb(0 0 0 / .25)}
.toast.bad{background:var(--danger);color:#fff}

/* coins */
.coins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.coins .ab b{font-family:var(--f-num);font-size:1.15rem}
.cl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--line);font-size:.86rem;align-items:baseline}
.cl:first-child{border-top:0}
.cl .amt{font-family:var(--f-num);font-weight:700;white-space:nowrap}
.cl .amt.in{color:var(--ok)} .cl .amt.out{color:var(--danger)}
.cl .when{font-size:.74rem;color:var(--muted);white-space:nowrap}
.cl .now{grid-column:2/-1;font-size:.76rem;color:var(--muted)}

/* session journal panel */
.jr{position:fixed;z-index:15;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding:12px;box-shadow:0 8px 28px rgb(0 0 0 / .22);right:0;left:0;bottom:0;height:min(45vh,420px);border-radius:14px 14px 0 0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
body.jr-open main .wrap{padding-bottom:calc(min(45vh,420px) + 24px)}
.jr textarea{flex:1;min-height:0;resize:none;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:inherit;line-height:1.5}
.jr .card-h h2{font-size:1.05rem}
@media (min-width:1000px){.jr{left:auto;top:calc(env(safe-area-inset-top,0px) + 12px);bottom:12px;right:12px;width:360px;height:auto;border-radius:var(--r)}body.jr-open main .wrap,body.jr-open .top .wrap{padding-right:396px}body.jr-open main .wrap{padding-bottom:96px}}
.jr-fab{position:fixed;z-index:15;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:999px;box-shadow:0 6px 20px rgb(0 0 0 / .22);padding:10px 16px}
.cover{position:relative;height:clamp(160px,40vw,480px);background:#1d1b2e var(--cover-img,none) center 40%/cover no-repeat}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgb(0 0 0 / .45))}
.cover span{position:absolute;left:16px;bottom:10px;z-index:1;color:#fff;font-size:.8rem;opacity:.85;text-shadow:0 1px 3px #000}
.banner{font-size:.82rem;padding:6px 10px;border-radius:7px;background:var(--sunk);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.pip,.chip,.qa{transition:background .12s,border-color .12s}}
</style>

  <div class="wrap" id="topbar">

</header>
<main><div class="wrap" id="view"><div class="empty">Loading your sheet and play history…</div></div></main>

<script>
"use strict";
/* ================= RULES DATA (2014 5e) =================

const ABIL=[["str","Strength"],["dex","Dexterity"],["con","Constitution"],["int","Intelligence"],["wis","Wisdom"],["cha","Charisma"]];
const FULL_SLOTS=[[],[2],[3],[4,2],[4,3],[4,3,2],[4,3,3],[4,3,3,1],[4,3,3,2],[4,3,3,3,1],[4,3,3,3,2],[4,3,3,3,2,1],[4,3,3,3,2,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1,1],[4,3,3,3,3,1,1,1,1],[4,3,3,3,3,2,1,1,1],[4,3,3,3,3,2,2,1,1]];

const slug=t=>String(t).toLowerCase().replace(/['’]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function fixSpell(o){o=Object.assign({},o);if(o.lvl==null)o.lvl=+o.level||0;if(o.time&&!TIME_LABEL[o.time]){const t=String(o.time).toLowerCase();if(/bonus/.test(t))o.time="bonus";else if(/reaction/.test(t))o.time="reaction";else if(/^1 action$|^action$/.test(t))o.time="action";else{o.castTime=o.time;o.time="minute"}}if(!o.time)o.time="action";return o}
// A content pack adds spells, magic items, features and subclasses on top of the built-in rules. It's stored with your data, never in the repo.
function applyPack(p){
  const src=p.name||"Content pack";
  const each=(v,fn)=>{if(Array.isArray(v))v.forEach(x=>x&&x.name&&fn(slug(x.name),x));else if(v&&typeof v==="object")Object.entries(v).forEach(([k,x])=>x&&fn(k,Object.assign({name:k},x)))};
  each(p.spells,(k,x)=>{SPELLS[k]=Object.assign(fixSpell(x),{src:src})});
  each(p.items,(k,x)=>{ITEMS[k]=Object.assign({},x,{src:src})});
  if(p.features)each(p.features,(k,x)=>{FEATURE_TEXT[x.name]=x.text||x.sum||""});
  if(p.classes)Object.entries(p.classes).forEach(([n,d])=>{if(!CLASSES[n]&&d&&d.hd)CLASSES[n]=Object.assign({ability:null,caster:null,saves:[],subLevel:3,cantrips:null,known:null,mcProfs:"",feats:{},sub:{}},d)});
  if(p.subclasses)Object.entries(p.subclasses).forEach(([cls,subs])=>{if(CLASSES[cls])Object.entries(subs||{}).forEach(([n,f])=>{CLASSES[cls].sub[n]=f;SUBCLASS_NAMES[cls]=(SUBCLASS_NAMES[cls]||[]);if(!SUBCLASS_NAMES[cls].includes(n))SUBCLASS_NAMES[cls].push(n)})});
}
let BASE_SPELLS=null;
async function loadLibrary(){
  const get=async u=>{try{const r=await fetch(u,{cache:"no-cache"});return r.ok?await r.json():null}catch(e){return null}};
  const [sp,it]=await Promise.all([get("data/srd-spells.json"),get("data/srd-items.json")]);
  if(sp)for(const k in sp)if(!SPELLS[k])SPELLS[k]=Object.assign(fixSpell(sp[k]),{src:"SRD 5.1"});
  if(it)(Array.isArray(it)?it:Object.values(it)).forEach(x=>{ITEMS[slug(x.name)]=Object.assign({},x,{src:"SRD 5.1"})});
  try{PACKS=(await Store.list("packs")).map(p=>Object.assign(p,{id:p._id||p.id}))}catch(e){PACKS=[]}
  PACKS.forEach(p=>{try{applyPack(p)}catch(e){}});

/* ================= STORE (db capability, else this browser) ================= */
const LK="dnd-ledger:";
const Store={
  db:null,mode:"memory",mem:{},
  async init(){
    try{ if(window.claude&&window.claude.use){ this.db=await window.claude.use("db"); } }catch(e){ this.db=null; }
    if(this.db){this.mode="db";return}
    try{localStorage.setItem(LK+"probe","1");localStorage.removeItem(LK+"probe");this.mode="local"}catch(e){this.mode="memory"}
  },
  async get(path){
    if(this.mode==="db"){const s=await this.db.doc(path).get();return s.exists?clone(s.data()):null}
    if(this.mode==="local"){try{const v=localStorage.getItem(LK+path);return v?JSON.parse(v):null}catch(e){return null}}
    return this.mem[path]?clone(this.mem[path]):null;
  },
  async set(path,data){
    if(this.mode==="db")return this.db.doc(path).set(data);
    if(this.mode==="local"){localStorage.setItem(LK+path,JSON.stringify(data));return}
    this.mem[path]=clone(data);
  },
  async del(path){
    if(this.mode==="db")return this.db.doc(path).delete();
    if(this.mode==="local"){localStorage.removeItem(LK+path);return}
    delete this.mem[path];
  },
  async list(coll){
    if(this.mode==="db"){const q=await this.db.collection(coll).get();return q.docs.map(d=>Object.assign({},clone(d.data()),{_id:d.id}))}
    const out=[];const pre=coll+"/";
    const keys=this.mode==="local"?Object.keys(localStorage).filter(k=>k.startsWith(LK)).map(k=>k.slice(LK.length)):Object.keys(this.mem);
    for(const k of keys){if(k.startsWith(pre)&&!k.slice(pre.length).includes("/")){const v=await this.get(k);if(v)out.push(Object.assign(v,{_id:k.slice(pre.length)}))}}
    return out;
  },
  watch(path,isColl,fn){
    if(this.mode!=="db")return;
    try{const ref=isColl?this.db.collection(path):this.db.doc(path);ref.onSnapshot(fn,()=>{})}catch(e){}
  }
};
const pending={};
function persist(path,getData,delay=250){
  clearTimeout(pending[path]);
  pending[path]=setTimeout(async()=>{
    try{await Store.set(path,getData())}catch(e){toast("Couldn't save ("+(e&&e.code||"error")+"). Your last change may not be kept; export a backup.",true)}
    finally{delete pending[path]}
  },delay);
}

/* ================= EDITING LOGGED ACTIONS ================= */

function evEffect(e){

  const t=e.title||"",d=e.detail||"",add=(id,n)=>{f.res[id]=(f.res[id]||0)+n};let m;
  if(e.k==="spell"&&e.spell){if(e.slot>0)f.slots[e.slot]=1;if(/^Pact slot/.test(d))add("pact",1);if(/^Merge with Stone/.test(d))add(e.spell==="pass-without-trace"?"pwt":"bladeward",1);
    if(/Concentrating/.test(d)){const sp=knownSpells().find(x=>x.key===e.spell);f.conc={key:e.spell,name:sp?sp.name:t.split(" → ")[0]}}}
  if((m=/^(Spent|Restored) a (\d+)\w\w-level slot/.exec(t)))f.slots[+m[2]]=m[1]==="Spent"?1:-1;
  if(e.k==="feature"&&(m=/^(Spent|Restored) (.+)$/.exec(t))){const r=resources(C).find(x=>x.name===m[2]);if(r)add(r.id,m[1]==="Spent"?1:-1)}
  if(e.k==="feature"){const r=resources(C).find(x=>x.name===t);if(r)add(r.id,1)}
  if(/^Bardic Inspiration →/.test(t))add("bi",1);
  if(/^Played the Rhythm-Maker's Drum/.test(t)){add("drum",1);add("bi",-1)}
  if(e.k==="hp"&&/^Took \d+ damage/.test(t)){const ab=+((/(\d+) absorbed by temp HP/.exec(d)||[])[1]||0);f.hp=-Math.max(0,evAmt(e)-ab)}

  if(e.k==="attack"){if(e.ammo)f.ammo=1;if(/Psychic Blades/.test(d))add("bi",1)}

  if(e.k==="note"&&/^Used Inspiration/.test(t))f.insp=false;

function restAfter(e,longOnly){const i=EVENTS.indexOf(e);if(i<0)return false;return EVENTS.slice(i+1).some(x=>!x.undone&&x.k==="rest"&&(!longOnly||x.title==="Long rest"))}

    else if(ST.conc&&ST.conc.key===a.conc.key){ST.conc=null;out.push("concentration on "+a.conc.name+" ended")}}
  if(b.ammo!==a.ammo){const at=(C.attacks||[]).find(x=>x.ammo);const it=at&&(C.inventory||[]).find(i=>i.name===at.ammo);if(it){it.qty=Math.max(0,(it.qty||0)-(b.ammo-a.ammo));out.push(it.name.toLowerCase()+" "+it.qty)}}
  if(J(a.item)!==J(b.item)){const take=(it,sign)=>{const ex=C.inventory.find(i=>i.name===it.name);if(sign>0){if(ex)ex.qty=(ex.qty||0)+it.qty;else C.inventory.push({id:"i"+uid(),name:it.name,qty:it.qty,note:it.note||""})}

/* ================= GITHUB BACKUP ON CLOSE ================= */
// Closing a session queues a dated backup in the db. A scheduled task in Claude Code commits it to
// your repo as backups/<closed date>-session-<n>.json; the page asks it to run right away
// through the Claude Code Remote connector, and a daily run catches anything missed.
async function queueBackup(s){
  const d=today(),id=d+"-session-"+s.number;
  if(Store.mode!=="db"){const doc={session:s.number,sessionId:s.id,closed:new Date().toISOString(),closedDate:d,file:"backups/"+id+".json",status:"queued"};
    BACKUPS=BACKUPS.filter(b=>b.id!==id).concat([Object.assign({id:id},doc)]);return localBackup(id)}
  const doc={session:s.number,sessionId:s.id,closed:new Date().toISOString(),closedDate:d,file:"backups/"+id+".json",status:"queued"};
  try{await Store.set("backups/"+id,doc);BACKUPS=BACKUPS.filter(b=>b.id!==id).concat([Object.assign({id:id},doc)])}
  catch(e){toast("Couldn't queue the GitHub backup ("+(e&&e.code||"error")+"). Export one from the Backup tab.",true);return}
  pokeBackup(id);
}
const BK_NOTE={};
// Run as the Mac app (tools/serve.py), the page hands the backup to the local server, which commits
// and pushes it with this computer's git login. Anywhere else it downloads the file instead.
async function localBackup(id){
  const b=BACKUPS.find(x=>x.id===id);if(!b)return;const data=exportObj();
  try{const r=await fetch("api/backup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({file:b.file,message:"Ledger backup after session "+b.session+" (closed "+b.closedDate+")",data:data})});
    const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||("HTTP "+r.status));
    Object.assign(b,{status:j.pushed?"saved":"failed",commit:j.commit||"",commitUrl:j.commitUrl||"",savedAt:new Date().toISOString(),error:j.pushed?"":"Committed on this Mac but not pushed to GitHub. Push it from GitHub Desktop."});
    toast(j.pushed?"Backup saved to GitHub.":"Backup committed on this Mac; push it from GitHub Desktop.",!j.pushed);
  }catch(e){b.status="failed";b.error="No local backup server, so the file was downloaded instead.";offerFile("ledger-"+id+".json",JSON.stringify(data,null,1))}
  const o=Object.assign({},b);delete o.id;delete o._id;try{await Store.set("backups/"+id,o)}catch(e){}
  requestRender();
}
async function pokeBackup(id){
  let cfg=null;try{cfg=await Store.get("app/config")}catch(e){}
  const tid=cfg&&cfg.backupTrigger;if(!tid){BK_NOTE[id]="It will be saved on the next daily backup run.";requestRender();return}
  try{const mcp=window.claude&&await window.claude.use("mcp");if(!mcp)throw{code:"unavailable"};
    await mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:tid,text:"Backup queued: "+id});
    BK_NOTE[id]="Saving to GitHub now.";
  }catch(e){const c=e&&e.code;BK_NOTE[id]=c==="not_in_manifest"||c==="approval_required"||c==="consent_required"?"Not sent yet because the page wasn't allowed to start the backup. It will still be saved on the daily run.":c==="server_not_connected"?"Claude Code isn't reachable from this page, so it will be saved on the daily run.":"Couldn't start the backup just now ("+(c||"error")+"). It will be saved on the daily run."}
  requestRender();
}
function backupFor(sessionId){return BACKUPS.filter(b=>b.sessionId===sessionId).sort((a,b)=>(b.closed||"").localeCompare(a.closed||""))[0]||null}
function backupHTML(b){if(!b)return "";
  if(b.status==="saved")return `<span class="tag ok-tag">Backed up to GitHub</span>${b.commitUrl?` <a href="${esc(b.commitUrl)}" target="_blank" rel="noopener" style="font-size:.82rem">${esc(b.file||"commit")}</a>`:""}`;
  if(b.status==="failed")return `<span class="tag" style="color:var(--danger)">GitHub backup failed</span> <span class="muted" style="font-size:.8rem">${esc(b.error||"")}</span> <button class="btn ghost small" data-bkretry="${esc(b.id)}">Try again</button>`;
  return `<span class="tag">GitHub backup queued</span> <span class="muted" style="font-size:.8rem">${esc(BK_NOTE[b.id]||"Waiting for the backup run.")}</span>`}

const COIN={pp:1000,gp:100,ep:50,sp:10,cp:1};

// Coin entries, newest first. Older entries (before e.coin existed) are recognised by their title.
function coinLedger(){
  return EVENTS.filter(e=>!e.undone&&e.k==="item"&&(e.coin||/^(Gained|Spent) [\d.]+ (pp|gp|ep|sp|cp)/.test(e.title))).map(e=>{
    if(e.coin)return{t:e.t,dir:e.coin.dir,amt:e.coin.amt+" "+e.coin.d,why:e.coin.note,now:e.detail};
    const m=/^(Gained|Spent) ([\d.]+ \w+)(?:: (.*))?$/.exec(e.title)||[];return{t:e.t,dir:m[1]==="Gained"?1:-1,amt:m[2]||"",why:m[3]||"",now:e.detail};
  }).reverse();
}

// Returns {g, change} with the new purse, or null if there isn't enough.
function coinApply(gold,dir,a,d){
  const g=Object.assign({pp:0,gp:0,ep:0,sp:0,cp:0},gold);let change="";
  if(dir>0){const whole=Math.floor(a);g[d]=(g[d]||0)+whole;let rem=Math.round((a-whole)*COIN[d]);["sp","cp"].forEach(k=>{const n=Math.floor(rem/COIN[k]);g[k]=(g[k]||0)+n;rem-=n*COIN[k]})}
  else if(Number.isInteger(a)&&(g[d]||0)>=a){g[d]-=a}
  else{const left=coinTotal(g)-Math.round(a*COIN[d]);
    if(left<0)return null;
    // keep platinum and electrum if possible, make change in gp/sp/cp
    let rest=left;const out={pp:0,gp:0,ep:0,sp:0,cp:0};
    ["pp","ep"].forEach(k=>{const keep=Math.min(g[k]||0,Math.floor(rest/COIN[k]));out[k]=keep;rest-=keep*COIN[k]});
    ["gp","sp","cp"].forEach(k=>{out[k]=Math.floor(rest/COIN[k]);rest-=out[k]*COIN[k]});
    Object.assign(g,out);change=" (made change)"}
  Object.keys(g).forEach(k=>{if(!g[k])delete g[k]});if(!g.gp)g.gp=0;
  return{g:g,change:change};
}

function entryMarkdown(e){const t=e.stats||{},y=e.endOfSession||{};

  v.querySelector("#d-pack").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{let o;try{o=JSON.parse(rd.result)}catch(err){toast("That file isn't valid JSON.",true);return}
    if(o.format!=="dnd-content-pack"){toast("That isn't a content pack (it needs \"format\": \"dnd-content-pack\").",true);return}
    const id=slug(o.name||"pack")||"pack";o.name=o.name||"Content pack";try{applyPack(o);await Store.set("packs/"+id,o);PACKS=PACKS.filter(p=>p.id!==id).concat([Object.assign(o,{id:id})]);toast("Added "+o.name+".");render()}catch(err){toast("Couldn't add that pack ("+(err&&err.message||err)+").",true)}};rd.readAsText(f)};
  v.querySelectorAll("[data-rmpack]").forEach(b=>b.onclick=async()=>{await Store.del("packs/"+b.dataset.rmpack);toast("Removed. Reloading so its content is cleared.");setTimeout(()=>location.reload(),600)});
  v.querySelector("#d-imp").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{let o;try{o=JSON.parse(rd.result)}catch(err){$("#d-prev").innerHTML='<div class="warn bad">That file isn\'t valid JSON.</div>';return}
    if(!/^(yoruba|dnd)-ledger$/.test(o.format)||!o.character||!Array.isArray(o.events)){$("#d-prev").innerHTML='<div class="warn bad">That isn\'t a ledger backup.</div>';return}
    $("#d-prev").innerHTML=`<div class="warn">This backup from ${esc(new Date(o.exportedAt).toLocaleString())} has ${esc(o.character.name)} (${esc(classLine(o.character))}), ${o.events.length} log entries, ${(o.sessions||[]).length} sessions and ${(o.notes||[]).length} notes. Restoring replaces everything on this page.</div><button class="btn danger" id="d-do">Replace with this backup</button>`;
    $("#d-do").onclick=async()=>{$("#d-do").disabled=true;$("#d-do").textContent="Restoring…";try{await restore(o);toast("Backup restored.");render()}catch(err){toast("Restore failed: "+(err&&err.code||err),true)}}};rd.readAsText(f)};
}
async function restore(o){
  for(const s of SESS)await Store.del("sessions/"+s.id);for(const n of NOTES)await Store.del("notes/"+n.id);for(const c of CHUNKS)await Store.del("log/"+c.id);for(const e of ENTRIES)await Store.del("entries/"+e.id);
  ENTRIES=o.sessionEntries||[];
  C=o.character;ST=Object.assign(defaultState(C),o.state||{});normalize();SESS=o.sessions||[];NOTES=o.notes||[];EVENTS=o.events;CHUNKS=[];
  for(let i=0;i<EVENTS.length;i+=CHUNK){const n=CHUNKS.length+1;CHUNKS.push({id:"c"+String(n).padStart(5,"0"),n:n,events:EVENTS.slice(i,i+CHUNK)})}
  await Store.set("app/character",C);await Store.set("app/state",ST);
  for(const s of SESS)await Store.set("sessions/"+s.id,s);for(const n of NOTES)await Store.set("notes/"+n.id,n);for(const c of CHUNKS)await Store.set("log/"+c.id,{n:c.n,events:c.events});
  for(const e of ENTRIES)await Store.set("entries/"+e.id,e);
}

const VIEWS={play:[viewPlay,bindPlay],spells:[viewSpells,bindSpells],sheet:[viewSheet,bindSheet],journal:[viewJournal,bindJournal],history:[viewHistory,bindHistory],data:[viewData,bindData]};
function render(){
  if(!C)return;renderQueued=false;
  if(!VIEWS[TAB])TAB="play";
  renderTop();document.title=(C.name?C.name+"'s ":"")+"Ledger";if(!coverDone){coverDone=true;applyCover()}const v=$("#view");const[vf,bf]=VIEWS[TAB];
  const banner=Store.mode==="db"?"":`<div class="banner" style="margin-bottom:12px">${Store.mode==="local"?"Saving in this browser only. Export a backup from the Backup tab after each session.":"Changes here aren't being saved. Export a backup before you leave."}</div>`;
  v.innerHTML=banner+vf();bf(v);renderJournal();
  v.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{TAB=b.dataset.goto;render()});
  v.querySelectorAll("[data-pip]").forEach(b=>b.onclick=()=>spendPip(b.dataset.pip==="slot"?"slot":"res",b.dataset.id,+b.dataset.i));
}
function blankCharacter(){return{schema:1,name:"",player:"",race:"",size:"Medium",alignment:"",age:"",background:"",look:"",backstory:"",
  campaign:{name:"",dm:"",start:"",notes:""},abilities:{str:10,dex:10,con:10,int:10,wis:10,cha:10},classes:[],hpRolls:[],hpBonus:0,
  armor:{name:"None",base:10,dexCap:null,shield:false,bonus:0},speed:30,saveProfs:[],skillProfs:[],expertise:[],armorProf:"",weapons:"",tools:"",languages:"Common",
  drum:{owned:false},spells:[],attacks:[],inventory:[],gold:{gp:0,sp:0,cp:0},customFeatures:[],customResources:[],fightingStyle:null,favoredEnemy:"",favoredTerrain:"",levelPlan:[],magicItems:[]}}
// A file can be a full ledger backup, {"format":"dnd-character","character":{...}}, or just the character object.
function ledgerFromFile(o){
  if(o&&/^(yoruba|dnd)-ledger$/.test(o.format)&&o.character)return o;
  const c=o&&o.format==="dnd-character"?o.character:o;
  if(!c||typeof c!=="object"||!c.name||!c.abilities||!Array.isArray(c.classes)||!c.classes.length)throw "it needs at least name, abilities and classes (see data/character-template.json)";
  const ch=Object.assign(blankCharacter(),c);ch.campaign=Object.assign(blankCharacter().campaign,c.campaign||{});ch.abilities=Object.assign(blankCharacter().abilities,c.abilities);
  ch.classes=c.classes.map(k=>({cls:k.cls,sub:k.sub||"",level:Math.max(1,Math.min(20,+k.level||1))})).filter(k=>CLASSES[k.cls]);
  if(!ch.classes.length)throw "none of its classes are built in ("+Object.keys(CLASSES).join(", ")+")";
  const tl=ch.classes.reduce((a,k)=>a+k.level,0);
  if(!Array.isArray(c.hpRolls)||c.hpRolls.length!==tl){const hd=CLASSES[ch.classes[0].cls].hd;ch.hpRolls=[hd];ch.classes.forEach((k,i)=>{for(let j=i?0:1;j<k.level;j++)ch.hpRolls.push(CLASSES[k.cls].hd/2+1)});
    if(c.maxHP){ch.hpBonus=0;const calc=ch.hpRolls.reduce((a,b)=>a+b,0)+mod(ch.abilities.con)*tl;ch.hpBonus=+c.maxHP-calc}}
  if(!c.saveProfs)ch.saveProfs=CLASSES[ch.classes[0].cls].saves.slice();
  if(c.xp==null)ch.xp=XP_TABLE[Math.min(19,tl-1)];
  [["attacks","a"],["inventory","i"],["customResources","r"]].forEach(([k,pfx])=>{ch[k]=(ch[k]||[]).map(x=>Object.assign({id:pfx+uid()},x))});
  ch.inventory.forEach(x=>{if(x.qty==null)x.qty=1});
  ch.spells=(c.spells||[]).map(sp=>typeof sp==="string"?(SPELLS[sp]?{ref:sp}:{id:"c"+uid(),name:sp,lvl:0,time:"action",sum:""}):sp);
  return{format:"dnd-ledger",version:1,character:ch,state:null,sessions:[],notes:[],events:[]};
}
async function startLedger(o,how){SESS=[];NOTES=[];CHUNKS=[];ENTRIES=[];await restore(o);if(how)log("level",how,classLine(C)+" · "+maxHP(C)+" HP",null);else render()}
function renderEmpty(){
  $("#topbar").innerHTML=`<div class="ident"><h1>D&amp;D Ledger</h1><span class="sub">Character sheet and play log</span></div>`;
  const cl=Object.keys(CLASSES).sort();
  const ab=[["str","Str",15],["dex","Dex",14],["con","Con",13],["int","Int",12],["wis","Wis",10],["cha","Cha",8]];
  $("#view").innerHTML=`<div class="grid"><div class="col">
   <section class="card"><div class="card-h"><h2>Create your character</h2></div>
    <p class="muted" style="margin:0;font-size:.86rem">Fill in what's on your sheet. You can change any of it later on the Sheet tab, and add spells, attacks, gear and features there.</p>
    <div class="fgrid"><div class="field"><span class="label">Character name</span><input id="nc-name" autocomplete="off"></div><div class="field"><span class="label">Player</span><input id="nc-player" autocomplete="off"></div></div>
    <div class="fgrid"><div class="field"><span class="label">Race</span><input id="nc-race" autocomplete="off" placeholder="e.g. Hill Dwarf"></div><div class="field"><span class="label">Background</span><input id="nc-bg" autocomplete="off" placeholder="e.g. Soldier"></div></div>
    <div class="fgrid"><div class="field"><span class="label">Class</span><select id="nc-cls">${cl.map(c=>`<option>${c}</option>`).join("")}</select></div><div class="field"><span class="label">Subclass (if you have one)</span><input id="nc-sub" autocomplete="off" placeholder="e.g. Champion"></div></div>
    <div class="fgrid"><div class="field"><span class="label">Level</span><input id="nc-lvl" class="num" inputmode="numeric" value="1"></div><div class="field"><span class="label">Max HP (blank = average)</span><input id="nc-hp" class="num" inputmode="numeric" placeholder="auto"></div></div>
    <div class="field"><span class="label">Ability scores</span><div class="row" style="gap:6px;flex-wrap:wrap">${ab.map(([k,l,v])=>`<label style="display:flex;flex-direction:column;font-size:.75rem;font-weight:700;width:64px">${l}<input id="nc-${k}" class="num" inputmode="numeric" value="${v}" style="padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg)"></label>`).join("")}</div></div>
    <div class="fgrid"><div class="field"><span class="label">Armor</span><input id="nc-armor" autocomplete="off" placeholder="e.g. Chain mail"></div><div class="field"><span class="label">Armor's base AC</span><input id="nc-ac" class="num" inputmode="numeric" value="10"></div></div>
    <div class="fgrid"><div class="field"><span class="label">Dex bonus to AC</span><select id="nc-dexcap"><option value="">Full (light or none)</option><option value="2">Up to +2 (medium)</option><option value="0">None (heavy)</option></select></div><div class="field"><span class="label">Speed (ft)</span><input id="nc-speed" class="num" inputmode="numeric" value="30"></div></div>
    <label class="check"><input type="checkbox" id="nc-shield"> Shield (+2 AC)</label>
    <div class="field"><span class="label">Skill proficiencies</span><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 10px">${SKILLS.map(sk=>`<label class="check" style="font-size:.85rem"><input type="checkbox" data-ncskill="${sk[0]}"> ${sk[1]}</label>`).join("")}</div></div>
    <div id="nc-w"></div>
    <div class="row"><button class="btn primary" id="nc-ok">Create character</button></div>
   </section></div><div class="col">
   <section class="card"><div class="card-h"><h2>Or load a file</h2></div>
    <p class="muted" style="margin:0;font-size:.86rem">A ledger backup restores everything (sheet, sessions, notes, full log). You can also load a character file written from <a href="data/character-template.json" target="_blank" rel="noopener">data/character-template.json</a>.</p>
    <input type="file" id="e-imp" accept=".json,application/json"><div id="d-prev"></div>
    <div id="nc-example"></div>
   </section></div></div>`;
  fetch("data/example-character.json").then(r=>r.ok?r.json():null).then(o=>{if(!o)return;const b=document.createElement("button");b.className="btn";b.textContent="Try the example character ("+((o.character||o).name||"example")+")";b.onclick=async()=>{try{await startLedger(ledgerFromFile(o),"Loaded the example character")}catch(err){toast(String(err),true)}};$("#nc-example").append(b)}).catch(()=>{});
  $("#e-imp").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{const o=ledgerFromFile(JSON.parse(rd.result));await startLedger(o,o.events&&o.events.length?null:"Character loaded from "+f.name)}catch(err){$("#d-prev").innerHTML='<div class="warn bad">Couldn\'t load that file: '+esc(err)+'</div>'}};rd.readAsText(f)};
  $("#nc-ok").onclick=async()=>{const v=id=>$("#"+id).value.trim();const w=$("#nc-w");
    const name=v("nc-name");if(!name){w.innerHTML='<div class="warn">Give your character a name.</div>';$("#nc-name").focus();return}
    const level=Math.max(1,Math.min(20,parseInt(v("nc-lvl"))||1)),cls=v("nc-cls");
    const c=blankCharacter();Object.assign(c,{name:name,player:v("nc-player"),race:v("nc-race"),background:v("nc-bg"),speed:parseInt(v("nc-speed"))||30});
    ab.forEach(([k])=>{const n=parseInt(v("nc-"+k));c.abilities[k]=n>=1&&n<=30?n:10});
    c.classes=[{cls:cls,sub:v("nc-sub"),level:level}];
    const o=ledgerFromFile(Object.assign(c,{maxHP:parseInt(v("nc-hp"))||undefined,hpRolls:undefined}));
    const ch=o.character;ch.armor={name:v("nc-armor")||"None",base:parseInt(v("nc-ac"))||10,dexCap:v("nc-dexcap")===""?null:+v("nc-dexcap"),shield:$("#nc-shield").checked,bonus:0};
    ch.skillProfs=[...document.querySelectorAll("[data-ncskill]:checked")].map(x=>x.dataset.ncskill);
    await startLedger(o,"Created "+name);
  };
}
// Optional cover art: put an image at assets/cover.jpg, or set "cover" (an image URL) on the character.
function applyCover(){const el=$("#cover");if(!el||!C)return;const src=C.cover||"assets/cover.jpg";const im=new Image();
  im.onload=()=>{el.style.setProperty("--cover-img",'url("'+src.replace(/"/g,"")+'")');$("#cover-name").textContent=C.name;el.hidden=false};im.onerror=()=>{el.hidden=true};im.src=src}

/* ================= BOOT ================= */
function normalize(){
  C.classes=C.classes||[];C.hpRolls=C.hpRolls||[];C.spells=C.spells||[];C.attacks=C.attacks||[];C.inventory=C.inventory||[];C.customFeatures=C.customFeatures||[];C.customResources=C.customResources||[];C.gold=C.gold||{gp:0};C.campaign=C.campaign||{};C.armor=C.armor||{name:"None",base:10};C.abilities=C.abilities||{str:10,dex:10,con:10,int:10,wis:10,cha:10};
  ST=Object.assign(defaultState(C),ST||{});ST.used=ST.used||{};ST.slotsUsed=ST.slotsUsed||{};ST.hdUsed=ST.hdUsed||{};ST.conditions=ST.conditions||[];ST.death=ST.death||{s:0,f:0};
}
function applyChunks(list){CHUNKS=list.map(d=>({id:d._id||d.id,n:d.n,events:d.events||[]})).sort((a,b)=>a.n-b.n);EVENTS=[].concat(...CHUNKS.map(c=>c.events))}
if("serviceWorker" in navigator&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&!window.claude){navigator.serviceWorker.register("sw.js").catch(()=>{})}
async function boot(){
  await Store.init();
  await loadLibrary();
  try{
    C=await Store.get("app/character");
    if(!C){renderEmpty();return}
    ST=await Store.get("app/state");normalize();
    const [ss,ns,ls,es,bs]=await Promise.all([Store.list("sessions"),Store.list("notes"),Store.list("log"),Store.list("entries"),Store.list("backups").catch(()=>[])]);
    BACKUPS=bs.map(b=>Object.assign(b,{id:b._id||b.id}));
    ENTRIES=es.map(e=>Object.assign(e,{id:e.id||e._id}));
    SESS=ss.map(s=>Object.assign(s,{id:s.id||s._id}));NOTES=ns.map(n=>Object.assign(n,{id:n.id||n._id}));applyChunks(ls);
  }catch(e){$("#view").innerHTML='<div class="empty">Couldn\'t open the saved data ('+esc(e&&e.code||e)+'). Reload the page to try again.</div>';return}
  render();
  const live=(path,fn)=>Store.watch(path,false,snap=>{if(snap.metadata.hasPendingWrites||pending[path]||!snap.exists)return;fn(clone(snap.data()))});
  live("app/state",d=>{if(JSON.stringify(d)!==JSON.stringify(ST)){ST=d;normalize();requestRender()}});
  live("app/character",d=>{if(JSON.stringify(d)!==JSON.stringify(C)){C=d;normalize();requestRender()}});
  Store.watch("log",true,q=>{if(q.metadata.hasPendingWrites||Object.keys(pending).some(k=>k.startsWith("log/")))return;const list=q.docs.map(d=>Object.assign({},clone(d.data()),{_id:d.id}));const tot=list.reduce((a,c)=>a+(c.events||[]).length,0);
    const sg2=evs=>[evs.length,evs.filter(e=>e.undone).length,evs.reduce((a,e)=>a+(e.edits?e.edits.length:0),0)];const sig=JSON.stringify(list.map(c=>[c._id].concat(sg2(c.events||[]))));const mine=JSON.stringify(CHUNKS.map(c=>[c.id].concat(sg2(c.events))));
    if(sig!==mine&&tot>=0){applyChunks(list);requestRender()}});
  Store.watch("backups",true,q=>{if(q.metadata.hasPendingWrites)return;BACKUPS=q.docs.map(d=>Object.assign({},clone(d.data()),{id:d.id}));requestRender()});
  Store.watch("entries",true,q=>{if(q.metadata.hasPendingWrites||Object.keys(pending).some(k=>k.startsWith("entries/")))return;ENTRIES=q.docs.map(d=>Object.assign({},clone(d.data()),{id:d.id}));requestRender()});
  Store.watch("sessions",true,q=>{if(q.metadata.hasPendingWrites||Object.keys(pending).some(k=>k.startsWith("sessions/")))return;SESS=q.docs.map(d=>Object.assign({},clone(d.data()),{id:d.id}));requestRender()});
  Store.watch("notes",true,q=>{if(q.metadata.hasPendingWrites||Object.keys(pending).some(k=>k.startsWith("notes/")))return;NOTES=q.docs.map(d=>Object.assign({},clone(d.data()),{id:d.id}));requestRender()});
}
boot();
</script>
